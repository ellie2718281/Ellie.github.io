<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ellie Chang</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --cyan:#71ddff; --ink:#02050b; --panel:rgba(5,10,19,.82); --line:rgba(145,210,255,.14); }
    body { background:var(--ink); overflow:hidden; font-family:Inter,'Segoe UI',system-ui,sans-serif; color:#d9ecfa; }
    canvas { display:block; }

    /* ── Overlays ────────────────────────────────────────── */
    .vignette {
      position:fixed; inset:0; z-index:1; pointer-events:none;
      background:radial-gradient(ellipse at 50% 42%, transparent 32%, rgba(0,3,10,.25) 68%, rgba(0,0,0,.82) 100%),linear-gradient(180deg,rgba(1,4,12,.08),rgba(1,4,12,.38));
    }
    .scanlines {
      position:fixed; inset:0; z-index:2; pointer-events:none;
      opacity:.32; background:repeating-linear-gradient(to bottom, transparent 0, transparent 3px, rgba(0,0,0,.035) 3px, rgba(0,0,0,.035) 4px);
    }

    /* ── Loading ─────────────────────────────────────────── */
    #loading {
      position:fixed; inset:0; background:#04080f;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      z-index:300; transition:opacity 1s ease;
    }
    #loading.fade { opacity:0; pointer-events:none; }
    .load-face {
      width:88px; height:88px; border:2px solid #00d4ff33; border-radius:14px;
      display:flex; align-items:center; justify-content:center; gap:12px;
      animation:loadBob 0.85s ease-in-out infinite alternate;
    }
    .load-eye { width:18px; height:14px; background:#00d4ff; border-radius:3px;
      box-shadow:0 0 14px #00d4ff; animation:loadBlink 2.5s ease-in-out infinite; }
    @keyframes loadBob  { to { transform:translateY(-9px); } }
    @keyframes loadBlink { 0%,88%,100%{transform:scaleY(1)} 93%{transform:scaleY(0.08)} }
    .load-text { margin-top:22px; font-size:0.68rem; letter-spacing:5px; color:#00d4ff; opacity:0.7; }
    .load-bar  { margin-top:14px; width:110px; height:2px; background:#0d2035; border-radius:2px; overflow:hidden; }
    .load-fill { height:100%; width:0; background:#00d4ff; animation:loadBar 1.3s ease forwards; }
    @keyframes loadBar { to { width:100%; } }

    /* ── Header ──────────────────────────────────────────── */
    #header { position:fixed; top:30px; left:32px; z-index:40; pointer-events:none; opacity:0; transition:opacity 1s 0.4s; }
    #header.show { opacity:1; }
    #header h1 { font-size:1.18rem; font-weight:650; letter-spacing:6px; color:#f4fbff; text-shadow:0 0 22px rgba(0,212,255,.35); }
    #header p  { font-size:.65rem; letter-spacing:3.2px; color:#6f91a8; margin-top:7px; }

    /* ── Hint ────────────────────────────────────────────── */
    #hint { position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
      font-size:0.59rem; letter-spacing:2.6px; color:#486278;
      pointer-events:none; opacity:0; transition:opacity 1s 0.6s, color 0.4s; z-index:40; white-space:nowrap; }
    #hint.show { opacity:1; }

    /* ── Nav dots ─────────────────────────────────────────── */
    #nav { position:fixed; left:28px; top:50%; transform:translateY(-50%);
      display:flex; flex-direction:column; gap:14px; z-index:40;
      opacity:0; transition:opacity 1s 0.5s; }
    #nav.show { opacity:1; }
    .nav-dot { width:8px; height:8px; border-radius:50%; border:1px solid #31516b;
      cursor:pointer; transition:all 0.25s; position:relative; }
    .nav-dot:hover,.nav-dot.active { background:#00d4ff; border-color:#00d4ff; box-shadow:0 0 10px #00d4ff88; }
    .nav-dot::after { content:attr(data-label); position:absolute; left:18px; top:50%; transform:translateY(-50%);
      font-size:0.6rem; letter-spacing:2px; color:#2a5070; white-space:nowrap; opacity:0; transition:opacity 0.2s; }
    .nav-dot:hover::after { opacity:1; color:#5090b0; }
    .nav-dot.active::after { opacity:1; color:#00d4ff; }

    /* ── Station labels (DOM-projected) ─────────────────── */
    #labels { position:fixed; inset:0; pointer-events:none; z-index:30; }
    .slabel {
      position:absolute; transform:translate(-50%,-100%);
      padding:6px 14px; background:rgba(3,9,18,.72); border:1px solid currentColor;
      border-radius:20px; font-size:0.63rem; letter-spacing:3px;
      cursor:pointer; pointer-events:auto;
      transition:background 0.2s, opacity 0.2s, box-shadow 0.2s;
      white-space:nowrap; backdrop-filter:blur(12px); opacity:.82;
      margin-top:-8px; user-select:none;
    }
    .slabel:hover { background:rgba(255,255,255,0.06); opacity:1; box-shadow:0 0 16px -4px currentColor; }

    /* ── Content panel ───────────────────────────────────── */
    #panel {
      position:fixed; top:0; right:0; width:min(480px,100vw); height:100vh;
      background:var(--panel); border-left:1px solid var(--line);
      backdrop-filter:blur(30px) saturate(125%); padding:64px 38px 44px; overflow-y:auto;
      transform:translateX(100%); transition:transform 0.55s cubic-bezier(0.16,1,0.3,1); z-index:60;
    }
    #panel.open { transform:translateX(0); }
    #panel::-webkit-scrollbar { width:3px; }
    #panel::-webkit-scrollbar-thumb { background:#0e2030; border-radius:2px; }

    #panel-close { position:absolute; top:20px; right:20px; width:30px; height:30px;
      border:1px solid #0e2030; border-radius:50%; background:transparent;
      color:#2a5070; cursor:pointer; font-size:1rem;
      display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
    #panel-close:hover { border-color:#00d4ff; color:#00d4ff; }

    #panel-eyebrow { font-size:0.6rem; letter-spacing:4px; margin-bottom:8px; }
    #panel-title   { font-size:2rem; font-weight:350; letter-spacing:-.025em; line-height:1.12; margin-bottom:26px; }
    #panel-body    { font-size:.88rem; line-height:1.78; color:#86a2b6; }
    #panel-body strong { color:#d0e8ff; font-weight:500; }
    #panel-body p  { margin-bottom:0.8rem; }
    #panel-body .tag {
      display:inline-block; padding:2px 10px; border:1px solid #0e2030; border-radius:12px;
      font-size:0.63rem; letter-spacing:1px; color:#4080a0; margin:2px 2px 2px 0;

    }
    #panel-body .entry { margin-bottom:2rem; }
    #panel-body .edate  { font-size:0.63rem; letter-spacing:2px; margin-bottom:5px; }
    #panel-body .etitle { color:#d0e8ff; font-weight:500; font-size:0.95rem; margin-bottom:7px; }
    #panel-body .gh-btn {
      display:inline-flex; align-items:center; gap:7px;
      padding:8px 16px; border:1px solid #1a3050; border-radius:8px;
      text-decoration:none; color:#7098b8; font-size:0.72rem; letter-spacing:1px;
      margin-top:10px; transition:all 0.2s;
    }
    #panel-body .gh-btn:hover { border-color:currentColor; color:#d0e8ff; background:rgba(255,255,255,0.04); }
    #panel-body .gif-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:14px 0; }
    #panel-body .gif-grid img {
      width:100%; border-radius:6px; border:1px solid #0e2030;
      background:#0a1525; display:block; aspect-ratio:4/3; object-fit:cover;
    }
    #panel-body .proj-img { width:100%; border-radius:6px; border:1px solid #0e2030; margin:14px 0; background:#0a1525; }
    #panel-body .lrow {
      display:flex; align-items:center; gap:12px;
      padding:12px 16px; border:1px solid #0e2030; border-radius:8px;
      text-decoration:none; color:#d0e8ff; margin-bottom:10px; transition:border-color 0.2s;
    }
    #panel-body .lrow:hover { border-color:#00d4ff44; }

    /* ── Keyboard badge ──────────────────────────────────── */
    .kbd { display:inline-block; padding:1px 6px; background:#0d1e2e; border:1px solid #1a3050;
      border-radius:4px; font-size:0.6rem; color:#4080a0; margin:0 2px; }
    @media (max-width:700px) {

    }
    @media (prefers-reduced-motion:reduce) { #loading,.load-face,.load-eye,.load-fill { animation:none!important; } }
  </style>
</head>

// Error trap — shows what went wrong instead of hanging on loading screen
window.onerror = function(msg, src, line) {
  var el = document.getElementById('loading');
  el.innerHTML = '<div style="color:#ff5555;font-family:monospace;font-size:0.8rem;padding:32px;max-width:90vw;line-height:1.8">'
    + '<div style="color:#ff3080;letter-spacing:3px;margin-bottom:12px">BOOT ERROR</div>'
    + msg + '<br><span style="color:#4080a0">line ' + line + '</span></div>';
};
// Fallback: hide loading after 8s no matter what
setTimeout(function(){
  var el=document.getElementById('loading');
  if(el&&el.style.display!=='none'&&!el.innerHTML.includes('ERROR'))
    el.classList.add('fade');
},8000);
</script>

// ─── Renderer ─────────────────────────────────────────────────────────────────

var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
if ('outputColorSpace' in renderer && THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;
else if ('outputEncoding' in renderer && THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;
document.body.insertBefore(renderer.domElement, document.body.firstChild);

var scene  = new THREE.Scene();
scene.fog  = new THREE.FogExp2(0x000208, 0.016);

var camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 120);
camera.position.set(0, 8, 10);
camera.lookAt(0, 0, 0);

// ─── Sky sphere (deep indigo nebula) ─────────────────────────────────────────

var skySphere;
(function() {
  var S = 2048;
  var c = document.createElement('canvas'); c.width = c.height = S;
  var x = c.getContext('2d');

  // Near-black space base
  x.fillStyle = '#000106'; x.fillRect(0,0,S,S);

  // Milky way band — dense star region diagonal
  var mw = x.createLinearGradient(0,S*0.7,S,S*0.3);
  mw.addColorStop(0,'transparent');
  mw.addColorStop(0.3,'rgba(35,52,100,0.06)');
  mw.addColorStop(0.5,'rgba(70,92,150,0.12)');
  mw.addColorStop(0.7,'rgba(35,52,100,0.06)');
  mw.addColorStop(1,'transparent');
  x.fillStyle=mw; x.fillRect(0,0,S,S);

  // Broad, restrained color masses: navy first, then cyan/violet highlights.
  [{cx:900,cy:800,r:760,col:'rgba(29,43,126,0.34)'},
   {cx:350,cy:650,r:620,col:'rgba(52,22,122,0.27)'},
   {cx:1640,cy:420,r:590,col:'rgba(18,61,140,0.25)'},
   {cx:690,cy:500,r:430,col:'rgba(0,137,190,0.29)'},
   {cx:1420,cy:920,r:410,col:'rgba(34,105,215,0.25)'},
   {cx:280,cy:1250,r:390,col:'rgba(0,155,164,0.20)'},
   {cx:820,cy:1040,r:390,col:'rgba(130,38,175,0.24)'},
   {cx:1510,cy:710,r:330,col:'rgba(173,38,148,0.19)'},
   {cx:520,cy:290,r:310,col:'rgba(98,50,200,0.22)'},
   {cx:1710,cy:1420,r:300,col:'rgba(25,125,180,0.17)'},
   {cx:860,cy:750,r:190,col:'rgba(150,128,235,0.25)'},
   {cx:675,cy:520,r:145,col:'rgba(104,210,235,0.28)'},
   {cx:1370,cy:870,r:130,col:'rgba(209,111,190,0.20)'},
   {cx:720,cy:480,r:68,col:'rgba(215,244,255,0.48)'},
   {cx:870,cy:740,r:58,col:'rgba(228,217,255,0.40)'},
  ].forEach(function(cl){
    var g=x.createRadialGradient(cl.cx,cl.cy,0,cl.cx,cl.cy,cl.r);
    g.addColorStop(0,cl.col); g.addColorStop(0.5,cl.col.replace(/[\d.]+\)$/,function(m){return (parseFloat(m)*0.4).toFixed(2)+')'})); g.addColorStop(1,'transparent');
    x.fillStyle=g; x.fillRect(0,0,S,S);
  });

  // Dark dust lanes (opacity wipe — makes it look 3D)
  [{cx:600,cy:700,r:220,op:0.22},{cx:1100,cy:500,r:180,op:0.18},{cx:400,cy:1000,r:160,op:0.15}].forEach(function(d){
    var g=x.createRadialGradient(d.cx,d.cy,0,d.cx,d.cy,d.r);
    g.addColorStop(0,'rgba(0,1,6,'+d.op+')'); g.addColorStop(1,'transparent');
    x.fillStyle=g; x.fillRect(0,0,S,S);
  });

  // Dense micro-star field (thousands baked in)
  var rng=function(s){s=Math.sin(s*127.1)*43758.5453;return s-Math.floor(s);};
  var starCols=['rgba(255,255,255,','rgba(180,215,255,','rgba(255,220,170,','rgba(255,180,180,','rgba(180,255,230,'];
  for(var si=0;si<1800;si++){
    var sx=rng(si*1.13)*S, sy=rng(si*2.37)*S, sb=rng(si*3.71), sc=Math.floor(rng(si*5.11)*5);
    x.beginPath(); x.arc(sx,sy,0.2+sb*0.9,0,Math.PI*2);
    x.fillStyle=starCols[sc]+(0.35+sb*0.6)+')'; x.fill();
  }

  // Bright "giant" stars with halos + diffraction spikes
  var giantPos=[[320,280],[1050,180],[1750,580],[480,1100],[1600,1500]];
  giantPos.forEach(function(p,i){
    var br=0.4+rng(i*13.7)*0.6, sz=5+br*7;

var floorTex = (function(){

  x.fillStyle=base; x.fillRect(0,0,1024,1024);

    for(var row=-1;row<1024/hH+2;row++){

      x.strokeStyle='rgba(74,162,205,'+(Math.max(0,.12-edge*.09))+')';
      x.fillStyle='rgba(20,79,108,'+(Math.max(0,.026-edge*.02))+')';
      x.beginPath();
      for(var i=0;i<6;i++){var a=(Math.PI/3)*i;x.lineTo(cx+R*Math.cos(a),cy+R*Math.sin(a));}
      x.closePath(); x.fill(); x.stroke();

  }

  [132,240,355,468].forEach(function(rad,ri){

function makeBBox(w,h,d,col){
  var hw=w/2,hh=h/2,hd=d/2;

  var pts=[];

    pts.push(new THREE.Vector3(c[e[1]][0],c[e[1]][1],c[e[1]][2]));

// ─── Robot ────────────────────────────────────────────────────────────────────

function mkMat(col,em,ei) {
  return new THREE.MeshStandardMaterial({
    color:col, roughness:0.28, metalness:0.75,
    emissive: em!==undefined?em:col, emissiveIntensity: ei!==undefined?ei:0
  });
}

var Robot = (function(){
  function Robot() {
    this.root  = new THREE.Group();
    var S = mkMat(0xc4d4e2,0xc4d4e2,0.22), D = mkMat(0x8899a8,0x8899a8,0.12), CG = mkMat(0x00d4ff,0x00d4ff,1.6);

    this.bodyG = new THREE.Group(); this.bodyG.position.y=0.72;
    var bm = new THREE.Mesh(new THREE.BoxGeometry(0.56,0.65,0.36),S); bm.castShadow=true;
    var ch = new THREE.Mesh(new THREE.BoxGeometry(0.26,0.2,0.04),CG); ch.position.set(0,0.02,0.19);
    var cl = new THREE.PointLight(0x00d4ff,0.38,1.2); cl.position.set(0,0.02,0.38);
    this.bodyG.add(bm,ch,cl);

    // Head
    this.headG = new THREE.Group(); this.headG.position.y=1.18;
    var hm = new THREE.Mesh(new THREE.BoxGeometry(0.46,0.36,0.36),S); hm.castShadow=true;
    var eg = new THREE.BoxGeometry(0.086,0.068,0.04);
    var le = new THREE.Mesh(eg,CG); le.position.set(-0.105,0.06,0.19);
    var re = new THREE.Mesh(eg,CG); re.position.set(0.105,0.06,0.19);
    var eL = new THREE.PointLight(0x00d4ff,0.6,0.85); eL.position.set(0,0.06,0.34);
    var mo = new THREE.Mesh(new THREE.BoxGeometry(0.17,0.022,0.04),mkMat(0x00d4ff,0x00d4ff,0.8));
    mo.position.set(0,-0.07,0.19);
    this.headG.add(hm,le,re,eL,mo);
    [[-0.26],[0.26]].forEach(function(d){var e=new THREE.Mesh(new THREE.BoxGeometry(0.055,0.09,0.055),D);e.position.set(d[0],0.04,0);this.headG.add(e);}.bind(this));

    // Antenna
    this.antG=new THREE.Group(); this.antG.position.y=0.2;
    var aS=new THREE.Mesh(new THREE.CylinderGeometry(0.016,0.016,0.26,8),D); aS.position.y=0.13;
    var aB=new THREE.Mesh(new THREE.SphereGeometry(0.042,8,8),CG); aB.position.y=0.27;
    var aL=new THREE.PointLight(0x00d4ff,0.28,0.6); aL.position.y=0.27;
    this.antG.add(aS,aB,aL); this.headG.add(this.antG);

    // Arms
    this.leftArm  = mkArm(-1,D); this.rightArm = mkArm(1,D);

    // Legs
    this.leftLeg  = mkLeg(-1,D); this.rightLeg = mkLeg(1,D);

    this.root.add(this.bodyG,this.headG,this.leftArm,this.rightArm,this.leftLeg,this.rightLeg);
    this.baseY=0.114; this.root.position.y=this.baseY;
    scene.add(this.root);

    // Overhead fill light — keeps robot visible regardless of scene lighting
    var fill = new THREE.PointLight(0xffffff, 1.8, 4.5);
    fill.position.set(0, 2.5, 0.5);
    this.root.add(fill);

    // Shadow blob
    var blob=new THREE.Mesh(new THREE.CircleGeometry(0.34,16),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.2}));
    blob.rotation.x=-Math.PI/2; blob.position.y=-this.baseY+0.002;
    this.root.add(blob); this.blob=blob;

    this.state='idle'; this.t=0; this.target=null; this.stLook=null; this.onDone=null; this.speed=2.6;
    this.headTargetY=0; // for look-around
  }

  function mkArm(s,D){ var g=new THREE.Group(); g.position.set(s*0.375,0.98,0);
    var u=new THREE.Mesh(new THREE.BoxGeometry(0.13,0.44,0.13),D); u.position.y=-0.22; u.castShadow=true;
    var h=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.13,0.15),mkMat(0x6a7a88)); h.position.y=-0.48;
    g.add(u,h); return g; }

  function mkLeg(s,D){ var g=new THREE.Group(); g.position.set(s*0.16,0.38,0);
    var u=new THREE.Mesh(new THREE.BoxGeometry(0.165,0.4,0.165),D); u.position.y=-0.2; u.castShadow=true;
    var f=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.088,0.26),new THREE.MeshStandardMaterial({color:0x607080,roughness:0.5,metalness:0.5}));
    f.position.set(0,-0.45,0.05); g.add(u,f); return g; }

  Robot.prototype.moveTo=function(tx,tz,lx,lz,cb){
    this.target={x:tx,z:tz}; this.stLook=(lx!==null)?{x:lx,z:lz}:null; this.onDone=cb||null; this.state='walk';
    this.root.rotation.y=Math.atan2(tx-this.root.position.x, tz-this.root.position.z);
  };
  Robot.prototype.goHome=function(cb){ this.moveTo(0,0,null,null,function(){this.root.rotation.y=0;cb&&cb();}.bind(this)); };

  Robot.prototype.update=function(dt){
    this.t+=dt; var t=this.t;
    if(this.state==='idle'){
      this.root.position.y=this.baseY+Math.sin(t*1.25)*0.022;
      this.antG.rotation.z=Math.sin(t*1.9)*0.11;
      // Head tracks mouse (set externally)
      this.headG.rotation.y+=(this.headTargetY-this.headG.rotation.y)*0.08;
      this.leftArm.rotation.x=Math.sin(t*1.25)*0.04;
      this.rightArm.rotation.x=-Math.sin(t*1.25)*0.04;
      this.leftLeg.rotation.x=0; this.rightLeg.rotation.x=0;
      this.blob.material.opacity=0.2;
    } else if(this.state==='walk'&&this.target){
      var rx=this.root.position.x, rz=this.root.position.z;
      var _dx=rx-this.target.x, _dz=rz-this.target.z;
      var dist=Math.sqrt(_dx*_dx+_dz*_dz);
      if(dist<0.08){
        this.root.position.x=this.target.x; this.root.position.z=this.target.z; this.root.position.y=this.baseY;
        if(this.stLook){ this.root.rotation.y=Math.atan2(this.stLook.x-this.root.position.x,this.stLook.z-this.root.position.z); }
        this.leftLeg.rotation.x=0; this.rightLeg.rotation.x=0;
        this.leftArm.rotation.x=0; this.rightArm.rotation.x=0;
        this.headG.rotation.y=0; this.headTargetY=0;
        this.state='idle'; var cb=this.onDone; this.onDone=null; cb&&cb();
      } else {
        var dx=this.target.x-rx, dz=this.target.z-rz, len=Math.sqrt(dx*dx+dz*dz);
        var step=Math.min(this.speed*dt,dist);
        this.root.position.x+=(dx/len)*step; this.root.position.z+=(dz/len)*step;
        var sw=Math.sin(t*9)*0.38;
        this.leftLeg.rotation.x=sw; this.rightLeg.rotation.x=-sw;
        this.leftArm.rotation.x=-sw*0.45; this.rightArm.rotation.x=sw*0.45;
        this.root.position.y=this.baseY+Math.abs(Math.sin(t*9))*0.035;
        this.headG.rotation.y=0; this.antG.rotation.z=Math.sin(t*9)*0.05;
        this.blob.material.opacity=0.12;
      }
    }
  };
  return Robot;
})();

      [{x:-0.28,y:0.35},{x:-0.28,y:0.68},{x:-0.28,y:1.01}],
      [{x:0,y:0.2},{x:0,y:0.54},{x:0,y:0.88},{x:0,y:1.22}],
      [{x:0.28,y:0.45},{x:0.28,y:0.88}]
    ];
    var nodeMats = [];
    layers.forEach(function(layer) {
      layer.forEach(function(n) {
        var mat = new THREE.MeshStandardMaterial({color:data.color,emissive:data.color,emissiveIntensity:0.5,transparent:true,opacity:0.9});
        var node = new THREE.Mesh(new THREE.SphereGeometry(0.038,8,8), mat);
        node.position.set(n.x,n.y,0);
        fGroup.add(node);
        extras.nnNodes.push(node);
        nodeMats.push(mat);
      });
    });
    // Connections
    for (var li=0; li<layers.length-1; li++) {
      layers[li].forEach(function(from) {
        layers[li+1].forEach(function(to) {
          var pts=[new THREE.Vector3(from.x,from.y,0),new THREE.Vector3(to.x,to.y,0)];
          var lGeo=new THREE.BufferGeometry().setFromPoints(pts);
          var lMat=new THREE.LineBasicMaterial({color:data.color,transparent:true,opacity:0.12});
          var line=new THREE.Line(lGeo,lMat);
          fGroup.add(line);
          extras.nnLines.push({line:line,mat:lMat});
        });
      });
    }

  } else if (data.id==='industry') {
    // Animated robotic arm
    extras.armBase=new THREE.Group(); extras.armBase.position.y=0.1;
    var ab=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,0.22,12),dm); ab.position.y=0.11;
    extras.armSeg1=new THREE.Group(); extras.armSeg1.position.set(0,0.22,0);
    var as1=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.38,0.09),dm); as1.position.y=0.19;
    extras.armSeg1.add(as1);
    extras.armSeg2=new THREE.Group(); extras.armSeg2.position.set(0,0.38,0);
    var j1=new THREE.Mesh(new THREE.SphereGeometry(0.075,8,8),acc.clone()); j1.material.emissiveIntensity=0.6;
    extras.armSeg2.add(j1);
    var as2g=new THREE.Group(); as2g.position.y=0;
    var as2=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.32,0.07),dm); as2.position.y=0.16;
    as2g.add(as2);
    var clawG=new THREE.Group(); clawG.position.y=0.35;
    var cl1=new THREE.Mesh(new THREE.BoxGeometry(0.035,0.1,0.035),acc.clone()); cl1.position.set(0.055,0.05,0);
    var cl2=new THREE.Mesh(new THREE.BoxGeometry(0.035,0.1,0.035),acc.clone()); cl2.position.set(-0.055,0.05,0);
    extras.claw=clawG; clawG.add(cl1,cl2);
    as2g.add(clawG);
    extras.armSeg2.add(as2g);
    extras.armSeg1.add(extras.armSeg2);
    extras.armBase.add(ab,extras.armSeg1);
    fGroup.add(extras.armBase);

  } else if (data.id==='projects') {
    // Three orbiting screens
    extras.screens=[];
    for (var si=0; si<3; si++) {
      var sm=new THREE.Mesh(new THREE.PlaneGeometry(0.28,0.2),
        new THREE.MeshStandardMaterial({color:data.color,emissive:data.color,emissiveIntensity:0.55+si*0.15,transparent:true,opacity:0.88,side:THREE.DoubleSide}));
      sm.userData.baseAngle=(si/3)*Math.PI*2;
      sm.userData.orbitR=0.32;
      sm.userData.height=0.38+si*0.25;
      fGroup.add(sm);
      extras.screens.push(sm);
    }

  } else if (data.id==='contact') {
    // Satellite dish + signal rings
    var pole3=new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.022,0.5,8),dm); pole3.position.y=0.25;
    extras.dish=new THREE.Mesh(new THREE.ConeGeometry(0.28,0.09,16,1,true),
      new THREE.MeshStandardMaterial({color:data.color,emissive:data.color,emissiveIntensity:0.45,side:THREE.DoubleSide}));
    extras.dish.position.y=0.68; extras.dish.rotation.x=Math.PI*0.38;
    fGroup.add(pole3,extras.dish);
    // Signal rings
    for (var ri=0; ri<4; ri++) {
      var rGeo=new THREE.RingGeometry(0.05,0.1,32);
      var rMat=new THREE.MeshBasicMaterial({color:data.color,side:THREE.DoubleSide,transparent:true,opacity:0.7});
      var rMesh=new THREE.Mesh(rGeo,rMat);
      rMesh.rotation.x=-Math.PI/2; rMesh.position.y=0.01; rMesh.userData.phase=ri/4;
      fGroup.add(rMesh); extras.rings.push(rMesh);
    }
  }

  // Point light
  var ptL=new THREE.PointLight(data.color,1.1,5);
  ptL.position.y=1.2; group.add(ptL); extras.ptLight=ptL;

  // DOM label
  var labelEl=document.createElement('div');
  labelEl.className='slabel'; labelEl.style.color=data.hex; labelEl.style.borderColor=data.hex+'55';
  labelEl.textContent=data.label; labelEl.dataset.idx=idx;
  labelEl.addEventListener('click',function(e){e.stopPropagation();navigateTo(parseInt(e.currentTarget.dataset.idx));});
  document.getElementById('labels').appendChild(labelEl);

  scene.add(group);

  var clickMeshes=[]; group.traverse(function(o){if(o.isMesh){o.userData.stIdx=idx;clickMeshes.push(o);}});
  stationObjs.push({data:data,group:group,fGroup:fGroup,extras:extras,ptLight:ptL,labelEl:labelEl,clickMeshes:clickMeshes});
});

// ─── Ripple system ────────────────────────────────────────────────────────────

var ripples = [];
function spawnRipple(pos) {
  var mat = new THREE.MeshBasicMaterial({color:0x00d4ff,side:THREE.DoubleSide,transparent:true,opacity:0.55});
  var mesh = new THREE.Mesh(new THREE.RingGeometry(0.05,0.14,36), mat);
  mesh.rotation.x = -Math.PI/2; mesh.position.set(pos.x,0.012,pos.z);
  scene.add(mesh); ripples.push({mesh:mesh,t:0,life:1.4});
}

// ─── Raycasting ───────────────────────────────────────────────────────────────

var raycaster = new THREE.Raycaster();
var mouse2d   = new THREE.Vector2();
var floorPlane= new THREE.Plane(new THREE.Vector3(0,1,0),0);
var hoveredSt = null;
var allClickable = [];
stationObjs.forEach(function(st){allClickable=allClickable.concat(st.clickMeshes);});

// Collect robot meshes for click-to-wave
var robotMeshes = [];
robot.root.traverse(function(o){ if(o.isMesh) robotMeshes.push(o); });

// Wave animation state
var waving = false, waveT = 0;

renderer.domElement.addEventListener('click', function(e) {
  mouse2d.x=(e.clientX/window.innerWidth)*2-1;
  mouse2d.y=-(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse2d,camera);

  // Check robot first
  var robotHit = raycaster.intersectObjects(robotMeshes);
  if (robotHit.length && robot.state === 'idle') {
    waving = true; waveT = 0;
    return;
  }

  var hits=raycaster.intersectObjects(allClickable);
  if(hits.length){ navigateTo(hits[0].object.userData.stIdx); }
  else {
    var fp=new THREE.Vector3(); raycaster.ray.intersectPlane(floorPlane,fp);
    if(fp&&Math.sqrt(fp.x*fp.x+fp.z*fp.z)<9) spawnRipple(fp);
  }
});

renderer.domElement.addEventListener('mousemove', function(e) {
  mouse2d.x=(e.clientX/window.innerWidth)*2-1;
  mouse2d.y=-(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse2d,camera);
  var hits=raycaster.intersectObjects(allClickable);
  var nh=hits.length?hits[0].object.userData.stIdx:null;
  if(nh!==hoveredSt){ hoveredSt=nh; renderer.domElement.style.cursor=nh!==null?'pointer':'default'; }

  // Robot head tracking (look at cursor on ground plane)
  if(robot.state==='idle'){
    var fp2=new THREE.Vector3(); raycaster.ray.intersectPlane(floorPlane,fp2);
    if(fp2){
      var dx=fp2.x-robot.root.position.x, dz=fp2.z-robot.root.position.z;
      var worldAng=Math.atan2(dx,dz);
      var bodyAng=robot.root.rotation.y;
      var diff=worldAng-bodyAng;
      while(diff>Math.PI)diff-=Math.PI*2; while(diff<-Math.PI)diff+=Math.PI*2;
      robot.headTargetY=Math.max(-0.45,Math.min(0.45,diff));
    }
  }
});

// ─── Navigation ───────────────────────────────────────────────────────────────

var activeIdx=null, cameraXShift=0, panelOpen=false;

function navigateTo(idx) {
  activeIdx=idx; panelOpen=true;
  document.getElementById('panel').classList.remove('open');
  document.querySelectorAll('.nav-dot').forEach(function(d,i){d.classList.toggle('active',i===idx);});
  document.getElementById('hint').style.opacity='0';
  var st=stationObjs[idx], px=st.data.px, pz=st.data.pz;
  var len=Math.sqrt(px*px+pz*pz), nx=-px/len, nz=-pz/len;
  robot.moveTo(px+nx*1.25, pz+nz*1.25, px, pz, function(){openPanel(st.data);});
}

function openPanel(data) {
  document.getElementById('panel-eyebrow').textContent=data.eyebrow;
  document.getElementById('panel-eyebrow').style.color=data.hex;
  document.getElementById('panel-title').textContent=data.title;
  document.getElementById('panel-body').innerHTML=data.body;
  document.getElementById('panel').classList.add('open');
  cameraXShift=-2;
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  document.querySelectorAll('.nav-dot').forEach(function(d){d.classList.remove('active');});
  cameraXShift=0; activeIdx=null; panelOpen=false;
  robot.goHome(null);
}

document.getElementById('panel-close').addEventListener('click', closePanel);

document.querySelectorAll('.nav-dot').forEach(function(dot){
  dot.addEventListener('click',function(){navigateTo(parseInt(dot.dataset.station));});
});

// Keyboard navigation
document.addEventListener('keydown', function(e) {
  if(e.key>='1'&&e.key<='5') navigateTo(parseInt(e.key)-1);
  else if(e.key==='Escape') { if(panelOpen) closePanel(); }
  else if(e.key==='ArrowRight'&&activeIdx!==null) navigateTo((activeIdx+1)%5);
  else if(e.key==='ArrowLeft'&&activeIdx!==null)  navigateTo((activeIdx+4)%5);
});

// ─── Main loop ────────────────────────────────────────────────────────────────

var clock=new THREE.Clock(), gt=0;

function animate() {
  requestAnimationFrame(animate);
  var dt=Math.min(clock.getDelta(),0.05);
  gt+=dt;

  robot.update(dt);

  // Wave animation (overrides idle arm when active)
  if (waving) {
    waveT += dt;
    var wp = waveT / 1.2; // 1.2 s duration
    if (wp >= 1) { waving = false; robot.rightArm.rotation.x = 0; robot.rightArm.rotation.z = 0; }
    else {
      robot.rightArm.rotation.z = -Math.sin(wp * Math.PI) * 1.1; // raise arm
      robot.rightArm.rotation.x = Math.sin(waveT * 14) * 0.35;   // wiggle
    }
  }

  stationObjs.forEach(function(st,si) {
    var ex=st.extras, t=gt, seed=ex.seed;
    var isHov=(si===hoveredSt);

    // Float group
    ex.fGroup.position.y=0.2+Math.sin(t*1.4+seed)*0.055;
    var tScale=isHov?1.12:1;
    ex.fGroup.scale.x+=(tScale-ex.fGroup.scale.x)*0.1;
    ex.fGroup.scale.y+=(tScale-ex.fGroup.scale.y)*0.1;
    ex.fGroup.scale.z+=(tScale-ex.fGroup.scale.z)*0.1;

    // Light
    ex.ptLight.intensity=(isHov?2.8:1.0)+Math.sin(t*2.2+seed)*0.25;

    // About: screen pulse
    if(ex.screen) ex.screen.material.emissiveIntensity=0.6+Math.sin(t*0.9+seed)*0.18;

    // Research: neural net pulse
    if(ex.nnNodes.length){
      ex.nnNodes.forEach(function(n,ni){
        n.material.emissiveIntensity=0.25+Math.abs(Math.sin(t*2+ni*0.6))*0.9;
        n.material.opacity=0.6+Math.abs(Math.sin(t*1.5+ni*0.4))*0.4;
      });
      ex.nnLines.forEach(function(l,li){
        l.mat.opacity=0.06+Math.abs(Math.sin(t*1.8+li*0.3))*0.3;
      });
    }

    // Industry: animated arm
    if(ex.armSeg1){
      ex.armSeg1.rotation.z=Math.sin(t*0.7+seed)*0.5;
      ex.armSeg2.rotation.z=Math.sin(t*0.9+seed+1)*0.4;
      if(ex.claw){ ex.claw.rotation.y=t*1.2; ex.claw.children[0].position.x=0.055+Math.sin(t*1.5)*0.02; ex.claw.children[1].position.x=-0.055-Math.sin(t*1.5)*0.02; }
    }

    // Projects: orbiting screens
    if(ex.screens){
      ex.screens.forEach(function(s){
        var ang=s.userData.baseAngle+t*0.5;
        var r=s.userData.orbitR;
        s.position.set(Math.sin(ang)*r, s.userData.height, Math.cos(ang)*r);
        s.rotation.y=-ang;
      });
    }

    // Contact: expanding rings
    if(ex.rings.length){
      ex.rings.forEach(function(r){
        var rp=((t*0.55)+r.userData.phase)%1;
        var sc=1+rp*10; r.scale.set(sc,1,sc); r.material.opacity=(1-rp)*0.65;
      });
    }
  });

  // The distant sky and foreground star shells drift at separate speeds for depth.
  skySphere.rotation.y=gt*.0032;
  skySphere.rotation.x=Math.sin(gt*.035)*.012;
  // Small independent groups twinkle asynchronously.
  if(starLayers.length){
    starLayers.forEach(function(layer){
      layer.mat.opacity=layer.base+Math.sin(gt*layer.rate+layer.phase)*layer.amp;
    });
    starGroups.forEach(function(group,i){ group.rotation.y += dt*(0.0007+i*0.00015); });
  }
  // Haze drifts, rolls, and changes hue almost imperceptibly.
  nebulaCloud.forEach(function(nc){
    nc.pts.rotation.y += nc.spd * dt;
    nc.pts.rotation.z += nc.spd*.22*dt;
    nc.pts.rotation.x=Math.sin(gt*.025+nc.seed)*.04;
    nc.mat.opacity=.016+Math.abs(Math.sin(gt*.12+nc.seed))*.02;
    nc.mat.color.setHSL(nc.hue+Math.sin(gt*.045+nc.seed)*.018,.68,.60);
  });

  // Planets orbit + slow self-rotation
  planets.forEach(function(p){
    p.ang += p.spd * dt;
    p.obj.g.position.set(Math.cos(p.ang)*p.R, p.Y, Math.sin(p.ang)*p.R);
    p.obj.sphere.rotation.y += dt * 0.06;
  });

  // Hub ring spin
  hubRings.forEach(function(hr){
    if(hr.spin==='y' && hr.m) hr.m.rotation.y += hr.speed*dt;
    if(hr.topLight) hr.topLight.intensity=0.55+Math.sin(gt*2)*0.25;
  });

  // Beacon
  beaconRing.material.opacity=0.12+Math.sin(gt*2.5)*0.09;
  edgeRing.material.opacity=0.55+Math.sin(gt*0.8)*0.12;
  floorSweep.rotation.y=gt*.065;
  floorSweep.children[0].material.opacity=.22+Math.sin(gt*.7)*.08;

  // Particles
  for(var pi=0;pi<PC;pi++){
    pPos[pi*3]+=pVel[pi][0]; pPos[pi*3+1]+=pVel[pi][1]; pPos[pi*3+2]+=pVel[pi][2];
    if(pPos[pi*3+1]>7){pPos[pi*3+1]=0;pPos[pi*3]=(Math.random()-0.5)*17;pPos[pi*3+2]=(Math.random()-0.5)*17;}
  }
  pGeo.attributes.position.needsUpdate=true;

  // Ripples
  ripples=ripples.filter(function(r){
    r.t+=dt; var p=r.t/r.life;
    if(p>=1){scene.remove(r.mesh);return false;}
    var sc=1+p*9; r.mesh.scale.set(sc,1,sc); r.mesh.material.opacity=0.55*(1-p);
    return true;
  });

  // Camera follow + parallax
  camT.lerp(robot.root.position,0.06);
  var tx=camT.x+cameraXShift+mouseParallax.x*0.5;
  var ty=camT.y+8;
  var tz=camT.z+10-mouseParallax.y*0.5;
  camera.position.x+=(tx-camera.position.x)*0.055;
  camera.position.y+=(ty-camera.position.y)*0.055;
  camera.position.z+=(tz-camera.position.z)*0.055;
  camera.lookAt(camT.x,camT.y+0.5,camT.z);

  // ── Mini robots ──────────────────────────────────────────────────────────
  miniRobots.forEach(function(mr) {
    mr.t += dt;
    var m = mr.m;

    if (mr.type === 'patrol') {
      mr.orbitAngle += mr.orbitSpeed * dt;
      var px = Math.sin(mr.orbitAngle)*mr.orbitR, pz = Math.cos(mr.orbitAngle)*mr.orbitR;
      m.g.position.x = px; m.g.position.z = pz;
      m.g.position.y = 0.08 + Math.abs(Math.sin(mr.t*7))*0.016;
      m.g.rotation.y = -mr.orbitAngle + (mr.orbitSpeed>0 ? Math.PI : 0);
      var sw = Math.sin(mr.t*7)*0.4;
      m.legLG.rotation.x= sw; m.legRG.rotation.x=-sw;
      m.armLG.rotation.x=-sw*0.45; m.armRG.rotation.x=sw*0.45;

    } else if (mr.type === 'franka') {
      // 5-second pick-and-place cycle
      var ph = (mr.t % 5.0) / 5.0;
      mr.fPivot.rotation.x = Math.sin(ph*Math.PI*2)*0.55 - 0.05;
      mr.fSeg2.rotation.x = -Math.abs(Math.sin(ph*Math.PI*2+0.3))*0.45;
      var gripping = (ph > 0.28 && ph < 0.78);
      mr.gf1.position.x = gripping ? 0.012 : 0.034;
      mr.gf2.position.x = gripping ? -0.012 : -0.034;
      mr.gripL.intensity = gripping ? 1.8 : 0.3;
      var liftAmt = (gripping && ph<0.55) ? Math.min(1,(ph-0.28)/0.12)*0.28 : (gripping ? Math.max(0,(0.78-ph)/0.15)*0.28 : 0);
      mr.pickCube.position.y = 0.05 + liftAmt;
      m.headG.rotation.x = -0.12;
      m.armLG.rotation.x = 0.15 + Math.sin(mr.t*0.7)*0.1;
      // sparks from gripper when gripping
      mr.sparkTimer -= dt;
      if (gripping && mr.sparkTimer <= 0) {
        mr.sparkTimer = 0.14 + Math.random()*0.22;
        var rp = m.g.position;
        var sp = new THREE.Mesh(new THREE.SphereGeometry(0.012,4,4),
          new THREE.MeshBasicMaterial({color:Math.random()>0.5?0xddeeff:0xaabbcc,transparent:true,opacity:0.9}));
        sp.position.set(rp.x+0.45*Math.cos(m.g.rotation.y), 0.18, rp.z+0.45*Math.sin(m.g.rotation.y));
        scene.add(sp);
        sparks.push({mesh:sp,t:0,life:0.22,vx:(Math.random()-0.5)*0.65,vy:0.5+Math.random()*0.5,vz:(Math.random()-0.5)*0.65});
      }

    } else if (mr.type === 'yolo') {
      mr.detBoxes.forEach(function(db){
        var conf = 0.45 + Math.abs(Math.sin(mr.t*1.8+db.phase))*0.55;
        db.mat.opacity = conf;
        db.lblMat.opacity = 0.55 + Math.abs(Math.sin(mr.t*2.2+db.phase))*0.40;
        db.pl.intensity = 0.4 + conf*0.8;
      });
      m.headG.rotation.y = Math.sin(mr.t*0.55)*0.55;
      m.headG.rotation.x = Math.sin(mr.t*0.3)*0.06 - 0.04;
      m.armLG.rotation.x = -0.18 + Math.sin(mr.t*0.5)*0.08;
      m.armRG.rotation.x = -0.18 + Math.sin(mr.t*0.6)*0.08;

    } else if (mr.type === 'sam') {
      // Bright beam sweeps up and down
      var scanY = 0.26 + Math.sin(mr.t*0.9)*0.24;
      mr.scanLine.position.y = scanY;
      mr.slMat.opacity = 0.75 + Math.abs(Math.sin(mr.t*0.9))*0.22;
      mr.scanLight.position.y = scanY;
      mr.scanLight.intensity = 1.2 + Math.abs(Math.sin(mr.t*0.9))*1.8;
      mr.scanPlane.position.y = scanY * 0.4;
      mr.scanMat.opacity = 0.08 + Math.abs(Math.sin(mr.t*0.9))*0.12;
      mr.segPatches.forEach(function(sp){
        sp.mat.opacity = 0.25 + Math.abs(Math.sin(mr.t*1.2+sp.phase))*0.35;
        sp.ringMat.opacity = 0.55 + Math.abs(Math.sin(mr.t*1.8+sp.phase))*0.40;
        sp.mesh.scale.setScalar(0.82 + Math.abs(Math.sin(mr.t*0.7+sp.phase))*0.32);
      });
      m.armLG.rotation.x = -0.55 + Math.sin(mr.t*0.55)*0.2;
      m.armRG.rotation.x = -0.55 + Math.sin(mr.t*0.55+1.0)*0.2;

    } else if (mr.type === 'rl') {
      // Tiny agent runs laps
      mr.agentAngle += mr.agentSpeed * dt;
      mr.agentMesh.position.set(
        Math.sin(mr.agentAngle)*0.55,
        0.055 + Math.abs(Math.sin(mr.agentAngle*2))*0.04,
        Math.cos(mr.agentAngle)*0.55
      );
      mr.agentL.position.copy(mr.agentMesh.position);
      var lapFrac = (mr.agentAngle%(Math.PI*2))/(Math.PI*2);
      // Bot nods when agent completes a lap
      m.headG.rotation.x = lapFrac < 0.06 ? -0.22 : Math.sin(mr.t*0.35)*0.04;
      m.headG.rotation.y = Math.sin(mr.t*0.3)*0.18;
    }

    // Universal: antenna + halo pulse
    m.antBall.emissiveIntensity = 2.5 + Math.sin(mr.t*3.5)*1;
    m.antLight.intensity = 0.18 + Math.sin(mr.t*3.5)*0.1;
    m.eyeL.emissiveIntensity = m.eyeR.emissiveIntensity = 3 + Math.sin(mr.t*2)*0.5;
    m.halo.intensity = 0.6 + Math.sin(mr.t*2)*0.2;
  });

  // ── Sparks ────────────────────────────────────────────────────────────────
  sparks = sparks.filter(function(sp) {
    sp.t += dt; var p = sp.t/sp.life;
    if (p >= 1) { scene.remove(sp.mesh); return false; }
    sp.mesh.position.x += sp.vx*dt;
    sp.mesh.position.y += sp.vy*dt - 3*p*dt;
    sp.mesh.position.z += sp.vz*dt;
    sp.mesh.material.opacity = 0.95*(1-p);
    sp.mesh.scale.setScalar(1-p*0.6);
    return true;
  });

  // ── Shooting stars ────────────────────────────────────────────────────────
  nextShoot -= dt;
  if(nextShoot <= 0) { spawnShootingStar(); nextShoot = 6+Math.random()*8; }
  shootingStars = shootingStars.filter(function(ss) {
    ss.t += dt;
    var p = ss.t/ss.life;
    if(p >= 1) { scene.remove(ss.line); scene.remove(ss.hMesh); return false; }
    ss.line.position.addScaledVector(ss.dir, ss.speed*dt);
    ss.hMesh.position.copy(ss.line.position);
    var op = 1.0*(1-p*p);
    ss.mat.opacity = op; ss.hMat.opacity = op;
    return true;
  });

  // ── Rockets ───────────────────────────────────────────────────────────────
  nextRocket -= dt;
  if(nextRocket <= 0) { spawnRocket(); nextRocket = 22+Math.random()*24; }
  rockets = rockets.filter(function(rk) {
    rk.t += dt; var p = rk.t/rk.life;
    if(p >= 1) { scene.remove(rk.g); return false; }
    rk.g.position.addScaledVector(rk.dir, rk.spd*dt);
    var flicker = 0.75+Math.random()*0.5;
    rk.exL.intensity = 5.5*(1-p*0.45)*flicker;
    rk.flameMat.opacity = 0.9*(1-p*0.3)*flicker;
    rk.iMat.opacity = 0.7*(1-p*0.3)*flicker;
    return true;
  });

  renderer.render(scene,camera);
  updateLabels();
}

// ─── Boot ─────────────────────────────────────────────────────────────────────

animate();
setTimeout(function(){
  var el=document.getElementById('loading');
  el.classList.add('fade');
  setTimeout(function(){el.style.display='none';},1000);
  document.getElementById('header').classList.add('show');
  document.getElementById('nav').classList.add('show');
  document.getElementById('hint').classList.add('show');
},1400);
</script>
