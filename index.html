<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#04080f">
  <title>Ellie Chang</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; }
    body { background:#04080f; overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif; color:#d0e8ff;
      touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
    canvas { display:block; }

    /* ── Overlays ────────────────────────────────────────── */
    .vignette {
      position:fixed; inset:0; z-index:1; pointer-events:none;
      background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.72) 100%);
    }
    .scanlines {
      position:fixed; inset:0; z-index:2; pointer-events:none;
      background:repeating-linear-gradient(to bottom, transparent 0, transparent 2px, rgba(0,0,0,0.028) 2px, rgba(0,0,0,0.028) 4px);
    }

    /* ── Loading ─────────────────────────────────────────── */
    #loading {
      position:fixed; inset:0; background:#04080f;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      z-index:300; transition:opacity 1s ease;
    }
    #loading.fade { opacity:0; pointer-events:none; }
    .load-face {
      width:88px; height:88px; border:2px solid #00d4ff33; border-radius:14px;
      display:flex; align-items:center; justify-content:center; gap:12px;
      animation:loadBob 0.85s ease-in-out infinite alternate;
    }
    .load-eye { width:18px; height:14px; background:#00d4ff; border-radius:3px;
      box-shadow:0 0 14px #00d4ff; animation:loadBlink 2.5s ease-in-out infinite; }
    @keyframes loadBob  { to { transform:translateY(-9px); } }
    @keyframes loadBlink { 0%,88%,100%{transform:scaleY(1)} 93%{transform:scaleY(0.08)} }
    .load-text { margin-top:22px; font-size:0.8rem; letter-spacing:5px; color:#00d4ff; opacity:0.8; }
    .load-bar  { margin-top:14px; width:110px; height:2px; background:#0d2035; border-radius:2px; overflow:hidden; }
    .load-fill { height:100%; width:0; background:#00d4ff; animation:loadBar 1.3s ease forwards; }
    @keyframes loadBar { to { width:100%; } }

    /* ── Header ──────────────────────────────────────────── */
    #header { position:fixed; top:28px; left:32px; z-index:40; pointer-events:none; opacity:0; transition:opacity 1s 0.4s; }
    #header.show { opacity:1; }
    #header h1 { font-size:1.8rem; font-weight:500; letter-spacing:7px; color:#ffffff; text-shadow:0 0 20px rgba(0,212,255,0.5); }
    #header p  { font-size:0.95rem; letter-spacing:4px; color:#cce8ff; margin-top:6px; }

    /* ── Hint ────────────────────────────────────────────── */
    #hint { position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
      font-size:0.8rem; letter-spacing:3px; color:#5a86a8;
      pointer-events:none; opacity:0; transition:opacity 1s 0.6s, color 0.4s; z-index:40; white-space:nowrap; }
    #hint.show { opacity:1; }
    .touch-only { display:none; }

    /* ── Nav dots ─────────────────────────────────────────── */
    #nav { position:fixed; left:32px; top:50%; transform:translateY(-50%);
      display:flex; flex-direction:column; gap:18px; z-index:40;
      opacity:0; transition:opacity 1s 0.5s; }
    #nav.show { opacity:1; }
    .nav-dot { width:10px; height:10px; border-radius:50%; border:1.5px solid #2a5070;
      cursor:pointer; transition:all 0.25s; position:relative; }
    .nav-dot::before { content:''; position:absolute; inset:-9px; } /* bigger tap target */
    .nav-dot:hover,.nav-dot.active { background:#00d4ff; border-color:#00d4ff; box-shadow:0 0 12px #00d4ff; }
    .nav-dot::after { content:attr(data-label); position:absolute; left:22px; top:50%; transform:translateY(-50%);
      font-size:0.75rem; letter-spacing:2px; color:#3f6f94; white-space:nowrap; opacity:0.75; transition:opacity 0.2s, color 0.2s; }
    .nav-dot:hover::after { opacity:1; color:#8cc4e6; }
    .nav-dot.active::after { opacity:1; color:#00d4ff; }

    /* ── Station labels (DOM-projected) ─────────────────── */
    #labels { position:fixed; inset:0; pointer-events:none; z-index:30; }
    .slabel {
      position:absolute; transform:translate(-50%,-100%);
      display:flex; align-items:center; gap:10px;
      padding:7px 18px 7px 8px; background:rgba(4,12,24,0.9); border:1.5px solid currentColor;
      border-radius:22px; font-size:0.85rem; font-weight:600; letter-spacing:3px;
      cursor:pointer; pointer-events:auto;
      transition:background 0.2s, transform 0.2s;
      white-space:nowrap; backdrop-filter:blur(8px);
      margin-top:-16px; user-select:none;
      animation:slPulse 2.8s ease-in-out infinite;
    }
    .slabel .sl-num {
      display:inline-flex; align-items:center; justify-content:center;
      min-width:26px; height:22px; padding:0 6px; border-radius:11px;
      background:var(--c); color:#04080f; font-size:0.7rem; letter-spacing:1px; font-weight:700;
    }
    .slabel::after { /* stem pointing down to the station */
      content:''; position:absolute; left:50%; top:100%; width:1.5px; height:16px;
      background:linear-gradient(currentColor, transparent); transform:translateX(-50%);
    }
    .slabel:hover, .slabel.hot {
      background:rgba(20,34,52,0.95); transform:translate(-50%,-100%) scale(1.1);
      animation:none; box-shadow:0 0 26px -2px currentColor;
    }
    @keyframes slPulse {
      0%,100% { box-shadow:0 0 10px -5px currentColor; }
      50%     { box-shadow:0 0 22px -3px currentColor; }
    }

    /* ── Content panel (bottom sheet on every screen size) ── */
    #panel {
      position:fixed; left:0; right:0; bottom:0; margin:0 auto;
      width:min(800px,100vw);
      height:64vh; height:64dvh;
      background:rgba(4,8,16,0.97);
      border:1px solid #0e2030; border-bottom:none; border-radius:18px 18px 0 0;
      backdrop-filter:blur(24px);
      padding:44px 40px calc(34px + env(safe-area-inset-bottom));
      overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
      transform:translateY(100%); transition:transform 0.55s cubic-bezier(0.16,1,0.3,1); z-index:60;
    }
    #panel.open { transform:translateY(0); }
    #panel::-webkit-scrollbar { width:3px; }
    #panel::-webkit-scrollbar-thumb { background:#0e2030; border-radius:2px; }
    #panel-handle { display:block; position:absolute; top:10px; left:50%; transform:translateX(-50%);
      width:40px; height:4px; border-radius:2px; background:#1a3550; }

    #panel-close { position:absolute; top:20px; right:20px; width:36px; height:36px;
      border:1px solid #1a3550; border-radius:50%; background:transparent;
      color:#5a86a8; cursor:pointer; font-size:1.2rem;
      display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
    #panel-close:hover { border-color:#00d4ff; color:#00d4ff; }

    #panel-eyebrow { font-size:0.75rem; letter-spacing:4px; margin-bottom:10px; }
    #panel-title   { font-size:2.3rem; font-weight:300; line-height:1.15; margin-bottom:26px; }
    #panel-body    { font-size:1.02rem; line-height:1.8; color:#8aa8c0; }
    #panel-body strong { color:#e4f2ff; font-weight:500; }
    #panel-body p  { margin-bottom:0.9rem; }
    #panel-body .tag {
      display:inline-block; padding:3px 12px; border:1px solid #16304a; border-radius:12px;
      font-size:0.78rem; letter-spacing:1px; color:#6aa6c8; margin:3px 3px 3px 0;
      transition:border-color 0.2s;
    }
    #panel-body .entry { margin-bottom:2.2rem; }
    #panel-body .edate  { font-size:0.75rem; letter-spacing:2px; margin-bottom:6px; }
    #panel-body .etitle { color:#e4f2ff; font-weight:500; font-size:1.15rem; margin-bottom:7px; }
    #panel-body .eorg   { font-size:0.85rem; color:#6a8aa5; margin:-4px 0 8px; }
    #panel-body .gh-btn {
      display:inline-flex; align-items:center; gap:7px;
      padding:9px 18px; border:1px solid #1a3050; border-radius:8px;
      text-decoration:none; color:#7098b8; font-size:0.85rem; letter-spacing:1px;
      margin-top:10px; transition:all 0.2s;
    }
    #panel-body .gh-btn:hover { border-color:currentColor; color:#d0e8ff; background:rgba(255,255,255,0.04); }
    #panel-body .gif-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:14px 0; }
    #panel-body .gif-grid img {
      width:100%; border-radius:6px; border:1px solid #0e2030;
      background:#0a1525; display:block; aspect-ratio:4/3; object-fit:cover;
    }
    #panel-body .proj-img { width:100%; border-radius:6px; border:1px solid #0e2030; margin:14px 0; background:#0a1525; }
    #panel-body .lrow {
      display:flex; align-items:center; gap:12px;
      padding:14px 18px; border:1px solid #0e2030; border-radius:8px;
      text-decoration:none; color:#d0e8ff; margin-bottom:10px; transition:border-color 0.2s;
      word-break:break-all; font-size:1rem;
    }
    #panel-body .lrow:hover { border-color:#00d4ff44; }

    /* ── Keyboard badge ──────────────────────────────────── */
    .kbd { display:inline-block; padding:1px 7px; background:#0d1e2e; border:1px solid #1a3050;
      border-radius:4px; font-size:0.74rem; color:#5a9ac0; margin:0 2px; }

    /* ── Robot speech bubble ─────────────────────────────── */
    #robot-say {
      position:fixed; left:0; top:0; z-index:35; pointer-events:none;
      transform:translate(-50%,-100%); margin-top:-14px;
      max-width:min(320px,72vw); width:max-content;
      padding:9px 14px 10px; background:rgba(3,14,24,0.92);
      border:1px solid #00d4ff66; border-radius:4px;
      font-family:'Courier New',ui-monospace,Menlo,monospace; font-size:0.82rem; line-height:1.55;
      letter-spacing:1.5px; color:#8eeaff; text-shadow:0 0 6px #00d4ff88;
      box-shadow:0 0 18px -6px #00d4ff, inset 0 0 12px -8px #00d4ff;
      opacity:0; transition:opacity 0.3s;
    }
    #robot-say.show { opacity:1; }
    #robot-say::after { /* tail */
      content:''; position:absolute; left:50%; bottom:-6px; width:10px; height:10px;
      background:rgba(3,14,24,0.92); border-right:1px solid #00d4ff66; border-bottom:1px solid #00d4ff66;
      transform:translateX(-50%) rotate(45deg);
    }
    #robot-say .say-tag { display:block; font-size:0.62rem; letter-spacing:2.5px; color:#3f95b5; margin-bottom:2px; }
    #robot-say .say-caret { display:inline-block; margin-left:2px; animation:caret 0.9s steps(1) infinite; }
    #robot-say::before { /* corner brackets */
      content:''; position:absolute; inset:-4px; pointer-events:none;
      background:
        linear-gradient(#00d4ff,#00d4ff) top left/8px 1px no-repeat,
        linear-gradient(#00d4ff,#00d4ff) top left/1px 8px no-repeat,
        linear-gradient(#00d4ff,#00d4ff) top right/8px 1px no-repeat,
        linear-gradient(#00d4ff,#00d4ff) top right/1px 8px no-repeat;
      opacity:0.7;
    }
    @keyframes caret { 50% { opacity:0; } }
    /* when there's no room above the head (or the panel is open) the bubble sits beside it */
    #robot-say.side { transform:translate(0,-50%); margin-top:0; margin-left:44px; }
    #robot-say.side::after { left:-6px; top:50%; bottom:auto; transform:translateY(-50%) rotate(135deg); }
    #robot-say.side.left { transform:translate(-100%,-50%); margin-left:-44px; }
    #robot-say.side.left::after { left:auto; right:-6px; transform:translateY(-50%) rotate(-45deg); }

    /* ── Zoom-out button (shown while focused on a bot) ─── */
    #zoom-out {
      position:fixed; left:50%; bottom:calc(64px + env(safe-area-inset-bottom)); z-index:45;
      transform:translate(-50%,12px); opacity:0; pointer-events:none;
      padding:10px 20px; border-radius:22px; border:1.5px solid #00d4ff; background:rgba(4,12,24,0.9);
      color:#8eeaff; font-family:'Courier New',ui-monospace,monospace; font-size:0.8rem; letter-spacing:2.5px;
      cursor:pointer; backdrop-filter:blur(8px); box-shadow:0 0 18px -6px #00d4ff; white-space:nowrap;
      transition:opacity 0.3s, transform 0.3s, background 0.2s;
    }
    #zoom-out.show { opacity:1; transform:translate(-50%,0); pointer-events:auto; }
    #zoom-out:hover { background:rgba(0,212,255,0.12); }

    /* ── Mini-robot speech bubble ─────────────────────────── */
    #mini-say {
      --c:#00d4ff;
      position:fixed; left:0; top:0; z-index:34; pointer-events:none;
      transform:translate(-50%,-100%); margin-top:-12px;
      max-width:min(260px,64vw); width:max-content;
      padding:7px 12px 8px; background:rgba(3,14,24,0.92);
      border:1px solid var(--c); border-radius:4px;
      font-family:'Courier New',ui-monospace,Menlo,monospace; font-size:0.74rem; line-height:1.5;
      letter-spacing:1.2px; color:var(--c); text-shadow:0 0 6px var(--c);
      box-shadow:0 0 14px -6px var(--c);
      opacity:0; transition:opacity 0.25s;
    }
    #mini-say.show { opacity:1; }
    #mini-say::after {
      content:''; position:absolute; left:50%; bottom:-5px; width:8px; height:8px;
      background:rgba(3,14,24,0.92); border-right:1px solid var(--c); border-bottom:1px solid var(--c);
      transform:translateX(-50%) rotate(45deg);
    }
    #mini-say .say-tag { display:block; font-size:0.58rem; letter-spacing:2px; opacity:0.65; margin-bottom:1px; }

    /* ── Star counter HUD ────────────────────────────────── */
    #stars {
      position:fixed; top:calc(28px + env(safe-area-inset-top)); right:28px; z-index:40; pointer-events:none;
      font-family:'Courier New',ui-monospace,Menlo,monospace; font-size:0.8rem; letter-spacing:2.5px;
      color:#ffe9a8; text-shadow:0 0 8px #ffcc5588;
      padding:7px 14px; border:1px solid #ffcc5544; border-radius:4px; background:rgba(3,14,24,0.7);
      opacity:0; transform:translateY(-6px); transition:opacity 0.4s, transform 0.4s;
    }
    #stars.show { opacity:1; transform:translateY(0); }
    #stars.bump { animation:starBump 0.45s ease; }
    @keyframes starBump { 40% { transform:scale(1.18); color:#ffffff; } }

    /* ── Touch devices: swap hint text ───────────────────── */
    @media (hover:none) {
      .desktop-only { display:none; }
      .touch-only { display:inline; }
    }

    /* ── Phones / narrow screens ─────────────────────────── */
    @media (max-width:768px) {
      #header { top:calc(18px + env(safe-area-inset-top)); left:18px; }
      #header h1 { font-size:1.25rem; letter-spacing:4px; }
      #header p  { font-size:0.7rem; letter-spacing:2.5px; margin-top:4px; }

      #nav { left:50%; top:auto; bottom:calc(24px + env(safe-area-inset-bottom));
        transform:translateX(-50%); flex-direction:row; gap:22px; }
      .nav-dot { width:12px; height:12px; }
      .nav-dot::before { inset:-12px; }
      .nav-dot::after { display:none; }

      #hint { bottom:calc(58px + env(safe-area-inset-bottom)); font-size:0.66rem; letter-spacing:2px; }
      #zoom-out { font-size:0.7rem; letter-spacing:1.5px; padding:9px 16px; }

      .slabel { font-size:0.68rem; letter-spacing:2px; padding:5px 12px 5px 6px; gap:7px; }
      .slabel .sl-num { min-width:21px; height:18px; font-size:0.6rem; }
      #robot-say { font-size:0.7rem; letter-spacing:1.2px; max-width:66vw; padding:7px 10px 8px; }
      #mini-say { font-size:0.64rem; letter-spacing:1px; max-width:60vw; padding:6px 9px 7px; }
      #stars { top:calc(18px + env(safe-area-inset-top)); right:18px; font-size:0.66rem; letter-spacing:1.5px; padding:5px 9px; }

      #panel { padding:38px 22px calc(28px + env(safe-area-inset-bottom)); }
      #panel-close { top:14px; right:14px; width:38px; height:38px; }
      #panel-title { font-size:1.75rem; margin-bottom:18px; }
      #panel-body  { font-size:0.95rem; line-height:1.7; }
      #panel-body .etitle { font-size:1.05rem; }
      #panel-body .entry { margin-bottom:1.8rem; }
    }
  </style>
</head>

<script>
// Error trap — shows what went wrong instead of hanging on loading screen
window.onerror = function(msg, src, line) {
  var el = document.getElementById('loading');
  el.innerHTML = '<div style="color:#ff5555;font-family:monospace;font-size:0.8rem;padding:32px;max-width:90vw;line-height:1.8">'
    + '<div style="color:#ff3080;letter-spacing:3px;margin-bottom:12px">BOOT ERROR</div>'
    + msg + '<br><span style="color:#4080a0">line ' + line + '</span></div>';
};
// Fallback: hide loading after 8s no matter what
setTimeout(function(){
  var el=document.getElementById('loading');
  if(el&&el.style.display!=='none'&&!el.innerHTML.includes('ERROR'))
    el.classList.add('fade');
},8000);
</script>

    body:`<div class="entry">
<div class="edate" style="color:#aa55ff">SEP 2026 – PRESENT</div>

// Walk cycle shared by the patrol bots: swinging hips, bending knees,
// counter-swinging arms, a little bob and side-to-side sway.
function miniWalkPose(m, p, g) {
  var s=Math.sin(p), c=Math.cos(p);
  m.legL.hip.rotation.x = -s*0.6*g;  m.legR.hip.rotation.x = s*0.6*g;
  m.legL.knee.rotation.x = Math.max(0,c)*0.95*g;  m.legR.knee.rotation.x = Math.max(0,-c)*0.95*g;
  m.armLG.rotation.x = s*0.6*g;  m.armRG.rotation.x = -s*0.6*g;
  m.bodyG.rotation.y = s*0.12*g;
  m.headG.rotation.z = -s*0.05*g;
  m.g.position.y += (1-Math.cos(2*p))*0.014*g;
  m.g.rotation.z = s*0.05*g;
}

function makeBBox(w,h,d,col){
  var hw=w/2,hh=h/2,hd=d/2;
  var c=[[-hw,-hh,-hd],[hw,-hh,-hd],[hw,hh,-hd],[-hw,hh,-hd],
         [-hw,-hh,hd],[hw,-hh,hd],[hw,hh,hd],[-hw,hh,hd]];
  var edges=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
  var pts=[];
  edges.forEach(function(e){
    pts.push(new THREE.Vector3(c[e[0]][0],c[e[0]][1],c[e[0]][2]));
    pts.push(new THREE.Vector3(c[e[1]][0],c[e[1]][1],c[e[1]][2]));
  });
  return new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:col,transparent:true,opacity:0}));
}

function drawRLChart(R) {
  var c=R.chartC, x=c.getContext('2d'), W=c.width, H=c.height;
  x.clearRect(0,0,W,H);
  x.fillStyle='rgba(3,14,24,0.85)'; x.fillRect(0,0,W,H);
  x.strokeStyle='rgba(255,221,0,0.6)'; x.lineWidth=2; x.strokeRect(1,1,W-2,H-2);
  x.fillStyle='#ffdd00'; x.font='bold 18px "Courier New", monospace'; x.textBaseline='top';
  x.fillText('REWARD  EP '+R.ep, 12, 8);
  var eps=Math.max(0.05, 0.8*Math.pow(0.82,R.ep));
  x.fillStyle='rgba(255,221,0,0.6)'; x.font='14px "Courier New", monospace';
  x.fillText('ε='+eps.toFixed(2), W-80, 11);
  var L=14, T=38, PW=W-28, PH=H-52;
  x.strokeStyle='rgba(255,221,0,0.2)'; x.lineWidth=1;
  x.beginPath(); x.moveTo(L,T+PH/2); x.lineTo(L+PW,T+PH/2); x.stroke();
  var r=R.rewards, n=r.length;
  if (n) {
    x.strokeStyle='#ffdd00'; x.lineWidth=2.5; x.beginPath();
    for (var i=0;i<n;i++){
      var px=L+(n===1?PW/2:i/(Math.max(n,2)-1)*PW), py=T+PH*(1-(r[i]+1)/2);
      if(i===0) x.moveTo(px,py); else x.lineTo(px,py);
    }
    x.stroke();
    for (var k=0;k<n;k++){
      var qx=L+(n===1?PW/2:k/(Math.max(n,2)-1)*PW), qy=T+PH*(1-(r[k]+1)/2);
      x.fillStyle=r[k]>0?'#ffee88':'#ff5544'; x.beginPath(); x.arc(qx,qy,3,0,Math.PI*2); x.fill();
    }
  }
  R.chartTex.needsUpdate=true;
}

  var c=document.createElement('canvas'); c.width=8; c.height=128;
  var x=c.getContext('2d'), g=x.createLinearGradient(0,0,0,128);
  g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(0.45,'rgba(255,255,255,0.35)');
  g.addColorStop(0.85,'rgba(255,255,255,0.9)'); g.addColorStop(1,'rgba(255,255,255,1)');
  x.fillStyle=g; x.fillRect(0,0,8,128);
  return new THREE.CanvasTexture(c);
})();

var smoke = [];
var SMOKE_MAX = LOW_POWER ? 70 : 160;
function spawnSmoke(pos, vel, hot) {
  if (smoke.length >= SMOKE_MAX) { var old = smoke.shift(); scene.remove(old.sp); old.sp.material.dispose(); }
  var sp = new THREE.Sprite(new THREE.SpriteMaterial({map:PUFF_TEX, color:hot?0xffb070:0xc8ccd4, transparent:true,
    opacity:hot?0.55:0.3, depthWrite:false, fog:true}));
  sp.position.copy(pos); sp.scale.setScalar(0.25); scene.add(sp);
  smoke.push({sp:sp, vel:vel, t:0, life:2.2+Math.random()*1.2, hot:hot, s0:0.22+Math.random()*0.1});
}
function updateSmoke(dt) {
  smoke = smoke.filter(function(s){
    s.t += dt; var p = s.t/s.life;
    if (p >= 1) { scene.remove(s.sp); s.sp.material.dispose(); return false; }
    s.sp.position.addScaledVector(s.vel, dt); s.vel.multiplyScalar(0.97);
    s.sp.scale.setScalar(s.s0 + p*1.6);
    if (s.hot && p > 0.12) { s.hot = false; s.sp.material.color.setHex(0xb8bec8); }
    s.sp.material.opacity = (s.hot?0.55:0.32)*(1-p)*(1-p);
    return true;
  });
}

function metal(col, rough, metalness, emi, ei) {
  var m = new THREE.MeshStandardMaterial({color:col, roughness:rough, metalness:metalness,
    emissive:emi||0x000000, emissiveIntensity:ei||0});
  if (SKY_ENV) { m.envMap = SKY_ENV; m.envMapIntensity = 1.2; }
  return m;
}

function spawnRocket() {
  var g = new THREE.Group();
  var white = metal(0xf2f4f7, 0.32, 0.35, 0x8a96a4, 0.35);
  var black = metal(0x14181e, 0.4, 0.6, 0x05080c, 0.3);
  var steel = metal(0x9aa3ad, 0.22, 0.95, 0x20262d, 0.4);
  var red   = metal(0xd8322a, 0.35, 0.3, 0x5a0d08, 0.5);

  // smooth ogive body (lathe profile, axis = +y)
  var prof = [[0,1.28],[0.05,1.22],[0.1,1.12],[0.145,0.98],[0.18,0.8],[0.2,0.62],[0.205,0.45],[0.205,-0.55],[0.19,-0.6],[0,-0.6]]
    .map(function(p){ return new THREE.Vector2(p[0],p[1]); });
  var body = new THREE.Mesh(new THREE.LatheGeometry(prof, 36), white); g.add(body);
  // nose tip, stripes and classic black/white roll pattern
  var tip = new THREE.Mesh(new THREE.LatheGeometry([[0,1.285],[0.052,1.215],[0.075,1.17],[0,1.17]].map(function(p){return new THREE.Vector2(p[0],p[1]);}),24), red); g.add(tip);
  [0.3,-0.35].forEach(function(y){
    var band = new THREE.Mesh(new THREE.CylinderGeometry(0.209,0.209,0.07,36), black); band.position.y=y; g.add(band);
  });
  var roll = new THREE.Mesh(new THREE.CylinderGeometry(0.208,0.208,0.2,36,1,true,0,Math.PI), black);
  roll.position.y = 0.0; g.add(roll);
  var roll2 = new THREE.Mesh(new THREE.CylinderGeometry(0.208,0.208,0.14,36,1,true,Math.PI,Math.PI), black);
  roll2.position.y = -0.2; g.add(roll2);
  // porthole
  var port = new THREE.Mesh(new THREE.TorusGeometry(0.05,0.012,8,20), steel);
  port.position.set(0,0.62,0.192); port.rotation.x = -0.12; g.add(port);
  var glass = new THREE.Mesh(new THREE.CircleGeometry(0.045,20), new THREE.MeshBasicMaterial({color:0x9fe8ff}));
  glass.position.set(0,0.62,0.19); glass.rotation.x = -0.12; g.add(glass);
  // swept fins
  var fs = new THREE.Shape();
  fs.moveTo(0,0); fs.lineTo(0.2,-0.2); fs.lineTo(0.22,-0.46); fs.lineTo(0,-0.34); fs.lineTo(0,0);
  var finGeo = new THREE.ExtrudeGeometry(fs, {depth:0.018, bevelEnabled:false});
  for (var fi=0; fi<4; fi++) {
    var piv = new THREE.Group(); piv.rotation.y = fi*Math.PI/2 + Math.PI/4; g.add(piv);
    var fin = new THREE.Mesh(finGeo, fi%2?black:red); fin.position.set(0.19,-0.2,-0.009); piv.add(fin);
  }
  // engine bell
  var bell = new THREE.Mesh(new THREE.LatheGeometry([[0.07,-0.6],[0.075,-0.64],[0.11,-0.74],[0.14,-0.82]].map(function(p){return new THREE.Vector2(p[0],p[1]);}),28),
    metal(0x3a3f46, 0.3, 0.9, 0x2a1408, 0.6));
  bell.material.side = THREE.DoubleSide; g.add(bell);

  // exhaust: outer plume, inner core, nozzle glow, shock diamonds
  var plume = new THREE.Group(); plume.position.y = -0.82; g.add(plume);
  function flame(r, len, col, op){
    var m = new THREE.MeshBasicMaterial({color:col, map:FLAME_TEX, transparent:true, opacity:op,
      blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide});
    var c = new THREE.Mesh(new THREE.ConeGeometry(r, len, 24, 1, true), m);
    c.rotation.x = Math.PI; c.position.y = -len/2; plume.add(c); return c;
  }
  var outer = flame(0.17, 1.3, 0xff7a2a, 0.75);
  var mid   = flame(0.12, 0.85, 0xffc060, 0.85);
  var core  = flame(0.07, 0.45, 0xffffff, 1.0);
  var glow = new THREE.Sprite(new THREE.SpriteMaterial({map:PUFF_TEX, color:0xffa050, transparent:true, opacity:0.9,
    blending:THREE.AdditiveBlending, depthWrite:false}));
  glow.scale.setScalar(0.9); plume.add(glow);
  var diamonds = [];
  for (var di=0; di<3; di++) {
    var d = new THREE.Sprite(new THREE.SpriteMaterial({map:PUFF_TEX, color:0xfff0d0, transparent:true, opacity:0.8,
      blending:THREE.AdditiveBlending, depthWrite:false}));
    d.position.y = -0.18 - di*0.2; d.scale.setScalar(0.16 - di*0.03); plume.add(d); diamonds.push(d);
  }
  var exL = new THREE.PointLight(0xff8833, 5.5, 5.0); exL.position.y = -1.0; g.add(exL);

  var theta=Math.random()*Math.PI*2;
  var sy=1.5+Math.random()*3.5;
  var sr=22;
  g.position.set(Math.cos(theta)*sr, sy, Math.sin(theta)*sr);
  var exitTheta=theta+Math.PI+(Math.random()-0.5)*1.1;
  var tgt=new THREE.Vector3(Math.cos(exitTheta)*22, sy+(Math.random()-0.5)*1.5, Math.sin(exitTheta)*22);
  var dir=new THREE.Vector3().subVectors(tgt, g.position).normalize();
  var q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
  g.quaternion.copy(q);
  scene.add(g);
  var rHit = new THREE.Mesh(new THREE.SphereGeometry(1.3,8,6), HIT_MAT); g.add(rHit);
  var rk = {g:g, dir:dir, plume:plume, flames:[outer,mid,core], glow:glow, diamonds:diamonds,
    spd:4+Math.random()*2.5, t:0, life:11+Math.random()*4, exL:exL, hit:rHit, boost:0, smokeT:0};
  rHit.userData.rocket = rk;
  rockets.push(rk);
}

var _rkN = new THREE.Vector3();
function updateRockets(dt) {
  nextRocket -= dt;
  if (nextRocket <= 0) { spawnRocket(); nextRocket = 10+Math.random()*14; }
  rockets = rockets.filter(function(rk) {
    rk.t += dt; var p = rk.t/rk.life;
    if (p >= 1) { scene.remove(rk.g); return false; }
    var boosting = rk.boost > 0;
    if (boosting) { rk.boost -= dt; rk.g.rotateY(dt*9); }
    var spd = rk.spd*(boosting?3.2:1);
    rk.g.position.addScaledVector(rk.dir, spd*dt);
    var flick = 0.85 + Math.random()*0.3, fs = boosting ? 1.7 : 1;
    rk.plume.scale.set(fs*(0.95+Math.random()*0.1), fs*flick, fs*(0.95+Math.random()*0.1));
    rk.flames[0].material.opacity = 0.6*flick; rk.flames[1].material.opacity = 0.75*flick;
    rk.glow.material.opacity = 0.75 + Math.random()*0.25;
    rk.diamonds.forEach(function(d,i){ d.material.opacity = (0.55 + Math.random()*0.4)*(1 - i*0.2); });
    rk.exL.intensity = 5.5*flick*(boosting?2:1)*(1-p*0.3);
    // smoke trail: puffs left behind at the nozzle, drifting slowly
    rk.smokeT -= dt;
    if (rk.smokeT <= 0) {
      rk.smokeT = (LOW_POWER ? 0.07 : 0.035) / (boosting ? 2 : 1);
      _rkN.set(0,-1.05,0); rk.g.localToWorld(_rkN);
      var v = rk.dir.clone().multiplyScalar(-0.6 - Math.random()*0.4);
      v.x += (Math.random()-0.5)*0.3; v.y += (Math.random()-0.5)*0.3 + 0.05; v.z += (Math.random()-0.5)*0.3;
      spawnSmoke(_rkN.clone(), v, Math.random() < 0.35);
    }
    return true;
  });
  updateSmoke(dt);
}

function mkMat(col,em,ei) {
  return new THREE.MeshStandardMaterial({
    color:col, roughness:0.28, metalness:0.75,
    emissive: em!==undefined?em:col, emissiveIntensity: ei!==undefined?ei:0
  });
}

var Robot = (function(){

    // antenna
    this.antG=new THREE.Group(); this.antG.position.y=0.205;
    var aBase=mesh(new THREE.CylinderGeometry(0.035,0.045,0.03,16), JT);

    this.antG.add(aBase,aS,aB,aL); this.headG.add(this.antG);

    // ── Limbs ──

  // Shoulder pad → upper arm → elbow → forearm with glowing cuff → round hand
  function mkArm(s,SH,JT,ACC){ var g=new THREE.Group(); g.position.set(s*0.34,0.97,0);

  // Thigh → knee → shin with accent band → rounded boot with dark sole
  function mkLeg(s,SH,JT,ACC){ var g=new THREE.Group(); g.position.set(s*0.12,0.38,0);
    var th=new THREE.Mesh(new THREE.CylinderGeometry(0.065,0.06,0.2,14),JT); th.position.y=-0.1; th.castShadow=true;
    var knee=new THREE.Group(); knee.position.y=-0.2;
    var kj=new THREE.Mesh(new THREE.SphereGeometry(0.075,14,10),SH);
    var sh=new THREE.Mesh(new THREE.CylinderGeometry(0.082,0.07,0.18,18),SH); sh.position.y=-0.11; sh.castShadow=true;

    knee.add(kj,sh,band,boot,sole); g.add(th,knee); g.userData.knee=knee; return g; }

  Robot.prototype.moveTo=function(tx,tz,lx,lz,cb){
    this.target={x:tx,z:tz}; this.stLook=(lx!==null&&lx!==undefined)?{x:lx,z:lz}:null;
    this.onDone=cb||null; this.state='walk';
  };
  Robot.prototype.goHome=function(cb){ var self=this; this.moveTo(0,0,null,null,function(){ self.yawTarget=0; cb&&cb(); }); };

  Robot.prototype.update=function(dt){
    this.t+=dt; var t=this.t, r=this.root;

    if(this.state==='walk'&&this.target){
      var dx=this.target.x-r.position.x, dz=this.target.z-r.position.z, dist=Math.sqrt(dx*dx+dz*dz);
      if(dist<0.03){
        r.position.x=this.target.x; r.position.z=this.target.z;
        this.yawTarget=this.stLook?Math.atan2(this.stLook.x-r.position.x,this.stLook.z-r.position.z):r.rotation.y;
        this.curSpeed=0; this.state='idle'; this.headTargetY=0;
        var cb=this.onDone; this.onDone=null; cb&&cb();
      } else {
        // turn smoothly toward the target, only speed up once facing it, ease in and out
        var d=angDiff(r.rotation.y, Math.atan2(dx,dz));
        r.rotation.y+=d*(1-Math.exp(-9*dt));
        var facing=Math.max(0,Math.cos(d));
        var want=this.speed*Math.min(1,Math.max(0.3,dist/1.1))*facing*facing;
        this.curSpeed=damp(this.curSpeed,want,5,dt);
        var step=Math.min(this.curSpeed*dt,dist);
        r.position.x+=dx/dist*step; r.position.z+=dz/dist*step;
        // gait phase follows distance travelled, so feet don't skate
        this.phase+=step*5.4 + (1-facing)*dt*6;
        this.gait=damp(this.gait, Math.min(1, 0.35+this.curSpeed/this.speed), 8, dt);
        var si=Math.floor(this.phase/Math.PI);
        if(si!==this.stepIdx){
          this.stepIdx=si;
          var side=(si%2)?1:-1, cy=Math.cos(r.rotation.y), sy=Math.sin(r.rotation.y);
          spawnFootPuff(r.position.x+side*0.16*cy, r.position.z-side*0.16*sy);
        }
      }
    }
    if(this.state==='idle'){
      this.gait=damp(this.gait,0,6,dt);

function updateDock(dt) {
  var d=Math.sqrt(robot.root.position.x*robot.root.position.x+robot.root.position.z*robot.root.position.z);
  var atHome = (d < 0.3 && robot.state === 'idle') ? 1 : 0;

  dock.halo.rotation.y += dt*0.12;
  dock.emblem.rotation.z -= dt*1.4;
  dock.haloMats.forEach(function(m,i){ m.opacity = 0.18 + 0.32*Math.max(0, Math.sin(gt*2.2 - i*0.4)); });
  dock.rimMat.emissiveIntensity = 1.2 + Math.sin(gt*2)*0.4 + dock.home*0.4;
  var blink = Math.floor(gt*2) % 4;
  dock.beacons.forEach(function(m,i){ m.color.setHex(i===blink ? 0xffffff : 0x1a7a99); });
  dock.charge.forEach(function(c){
    var q=((gt*0.45)+c.phase)%1;
    c.m.position.y = DOCK_TOP + 0.02 + q*1.6;
    c.m.scale.setScalar(1 - q*0.25);
    c.mat.opacity = dock.home * 0.7 * Math.sin(q*Math.PI);
  });
  dock.light.intensity = 0.6 + dock.home*0.5 + Math.sin(gt*2)*0.15;

// Each task bot "owns" a circle (itself + its workstation). Patrol bots bend
// their route around those circles instead of walking through them, the task
// bot looks up and waves as they pass, and when the two patrol bots meet they
// stop, face each other and wave hello.
var WORKSPACE = {franka:[0.3,0.3,0.75], yolo:[0,0.45,0.72], sam:[0,0.45,0.72], rl:[0,0.55,0.8]};
var obstacles = [], patrols = [];

  mr.greetT = 0; mr.greetCd = 0; mr.partner = null;
  if (mr.type === 'patrol') {
    mr.off = 0; mr.px = mr.m.g.position.x; mr.pz = mr.m.g.position.z;
    mr.yaw = mr.orbitAngle + (mr.orbitSpeed > 0 ? Math.PI/2 : -Math.PI/2);
    mr.wave = 0;
    patrols.push(mr); return;
  }
  var w = WORKSPACE[mr.type];
  var v = new THREE.Vector3(w[0],0,w[1]).applyEuler(new THREE.Euler(0,mr.baseRot,0)).add(mr.m.g.position);
  mr.obs = {r:w[2], ro:Math.sqrt(v.x*v.x+v.z*v.z), ao:Math.atan2(v.x,v.z)};
  mr.focusPt = v.clone();
  mr.armBase = {x:mr.m.armRG.rotation.x, z:mr.m.armRG.rotation.z};

  sam:   ['SEGMENT ME TOO!', 'NICE MASKS, SAM.'],

function startMeet(a, b) {
  a.greetT = b.greetT = 2.6; a.greetCd = b.greetCd = 14;
  a.partner = b; b.partner = a;
  var mid = a.m.g.position.clone().add(b.m.g.position).multiplyScalar(0.5); mid.y = 0.6;
  spawnBurst(mid, 0xff88cc, 24, 1.2, 0.1);

function updateMeetings(dt) {
  miniRobots.forEach(function(mr){ mr.greetCd = Math.max(0, mr.greetCd - dt); });
  if (patrols.length === 2) {
    var a = patrols[0], b = patrols[1];
    var dx = a.m.g.position.x - b.m.g.position.x, dz = a.m.g.position.z - b.m.g.position.z;
    if (a.greetT<=0 && b.greetT<=0 && a.greetCd<=0 && b.greetCd<=0 && dx*dx+dz*dz < 1.3*1.3) startMeet(a, b);
  }
  patrols.forEach(function(p){
    p.wave = Math.max(0, p.wave - dt*1.5);
    if (p.greetT > 0) return;
    obstacles.forEach(function(o){
      var dx = p.m.g.position.x - o.m.g.position.x, dz = p.m.g.position.z - o.m.g.position.z;
      if (dx*dx+dz*dz < 1.9*1.9) {
        p.wave = 1;
        if (o.greetT <= 0 && o.greetCd <= 0) {
          o.greetT = 2.0; o.greetCd = 9; o.partner = p;
          if (!miniSay.active && Math.random() < 0.7) miniSpeak(p, pick(PASS_LINES[o.type]));
        }
      }
    });
  });
}

function updatePatrol(mr, dt) {
  var m = mr.m;
  if (mr.greetT > 0) {
    // stopped: face the other bot and wave
    mr.greetT -= dt;
    var o = mr.partner.m.g.position;
    mr.yaw += angDiff(mr.yaw, Math.atan2(o.x - mr.px, o.z - mr.pz)) * (1 - Math.exp(-8*dt));
    m.g.position.set(mr.px, 0, mr.pz);
    miniWalkPose(m, mr.phase, 0);
    var k = Math.min(1, (2.6 - mr.greetT)/0.3) * Math.min(1, Math.max(0, mr.greetT)/0.35);
    m.armRG.rotation.z = 2.5*k + Math.sin(mr.t*13)*0.35*k;
    m.headG.rotation.z = Math.sin(mr.t*5)*0.1*k;
    var el = 2.6 - mr.greetT;
    if (el < 0.4) m.g.position.y += Math.sin(el/0.4*Math.PI)*0.12;
  } else {
    // walk the orbit, bending the radius around other bots' workstations
    var R0 = mr.orbitR, a = mr.orbitAngle, want = 0;
    obstacles.forEach(function(o){
      var arc = Math.abs(angDiff(a, o.obs.ao)) * R0;
      var clear = o.obs.r + 0.35, reach = clear + 0.9;
      if (arc > reach) return;
      var outOff = o.obs.ro + clear - R0, inOff = o.obs.ro - clear - R0;
      if (R0 + outOff > 8.9) outOff = 99;
      var off = Math.abs(outOff) < Math.abs(inOff) ? outOff : inOff;
      var w = smooth((reach - arc) / 0.9);
      if (Math.abs(off*w) > Math.abs(want)) want = off*w;
    });
    // keep-right rule: when the two patrol bots approach, the outer one steps further out
    patrols.forEach(function(q){
      if (q === mr || mr.orbitR < q.orbitR) return;
      var arc = Math.abs(angDiff(a, q.orbitAngle)) * R0;
      if (arc >= 2.2) return;
      var need = 0.75 - ((R0 + want) - (q.orbitR + q.off));
      if (need > 0) want += need * smooth((2.2 - arc) / 0.8);
    });
    mr.off = damp(mr.off, want, 3, dt);
    mr.orbitAngle += mr.orbitSpeed * dt;
    var R = R0 + mr.off;
    var nx = Math.sin(mr.orbitAngle)*R, nz = Math.cos(mr.orbitAngle)*R;
    var dx = nx - mr.px, dz = nz - mr.pz, len = Math.sqrt(dx*dx+dz*dz);
    if (len > 1e-5) mr.yaw += angDiff(mr.yaw, Math.atan2(dx,dz)) * (1 - Math.exp(-10*dt));
    mr.phase += len*16;
    mr.px = nx; mr.pz = nz;
    m.g.position.set(nx, 0, nz);
    miniWalkPose(m, mr.phase, 1);
    m.headG.rotation.z = 0;
    // friendly wave while walking past a coworker
    if (mr.wave > 0) m.armRG.rotation.z = 2.2*smooth(mr.wave) + Math.sin(mr.t*12)*0.3*mr.wave;
    else m.armRG.rotation.z = 0;
  }
  m.g.rotation.y = mr.yaw;
  m.headG.rotation.y = mr.greetT > 0 ? 0 : Math.sin(mr.t*0.6)*0.35;
}

// Task bots look up from their work and wave back
function updateTaskGreet(mr, dt) {
  var m = mr.m;
  if (mr.greetT <= 0) return;
  mr.greetT -= dt;
  if (mr.greetT <= 0) { m.armRG.rotation.x = mr.armBase.x; m.armRG.rotation.z = mr.armBase.z; return; }
  var k = Math.min(1, (2.0 - mr.greetT)/0.3) * Math.min(1, mr.greetT/0.35);
  m.armRG.rotation.x = mr.armBase.x*(1-k);
  m.armRG.rotation.z = mr.armBase.z + 2.4*k + Math.sin(mr.t*12)*0.35*k;
  var p = mr.partner.m.g.position, g = m.g.position;
  var la = angDiff(mr.baseRot, Math.atan2(p.x-g.x, p.z-g.z));
  m.headG.rotation.y += (Math.max(-1.3, Math.min(1.3, la)) - m.headG.rotation.y) * k;
  m.headG.rotation.x *= (1-k);
}

    sp.position.copy(pos); sp.scale.setScalar(2.3); scene.add(sp); return sp;
  });
  var geo = new THREE.BufferGeometry().setFromPoints(pts);
  geo.setDrawRange(0, 0);
  var mat = new THREE.LineBasicMaterial({color:0xbfe6ff, transparent:true, opacity:0.5, fog:false, depthWrite:false});
  var line = new THREE.Line(geo, mat); scene.add(line);
  autoConsts.push({sprites:sprites, line:line, geo:geo, mat:mat, n:n, t:0});
}
function updateAutoConstellations(dt) {
  nextAuto -= dt;
  if (nextAuto <= 0 && autoConsts.length < 2) { spawnAutoConstellation(); nextAuto = 7 + Math.random()*6; }
  autoConsts = autoConsts.filter(function(c){
    c.t += dt;
    var t = c.t, fade = t > 7 ? Math.max(0, 1 - (t-7)/1.5) : 1;
    c.sprites.forEach(function(sp,i){
      var appear = Math.min(1, Math.max(0, (t - i*0.15)/0.5));
      sp.material.opacity = appear*fade*(0.85 + Math.sin(gt*4+i)*0.15);
    });
    var drawn = Math.min(c.n, 1 + Math.floor(Math.max(0, t-0.9)/0.35));
    c.geo.setDrawRange(0, t > 0.9 ? drawn : 0);
    c.mat.opacity = 0.5*fade;
    if (t > 8.5) {
      c.sprites.forEach(function(sp){ scene.remove(sp); sp.material.dispose(); });
      scene.remove(c.line); c.geo.dispose(); c.mat.dispose();
      return false;
    }
    return true;
  });
}

function interactiveList() {
  var list = allClickable.concat(miniHits, planetHits);
  rockets.forEach(function(r){ list.push(r.hit); });
  shootingStars.forEach(function(s){ if(!s.caught) list.push(s.hit); });
  if (ufo && !ufo.flee) list.push(ufo.hit);
  return list;
}

function updateSpace(dt) {
  updateAutoConstellations(dt);
  updateMiniSpeech(dt);
  planets.forEach(function(p){
    p.pulse = Math.max(0, p.pulse - dt*1.1);
    p.spin  = Math.max(0, p.spin - dt*3);
    var k = p.pulse;
    p.obj.g.scale.setScalar(1 + Math.sin(k*Math.PI*3)*0.14*k);
    p.obj.sphere.material.uniforms.boost.value = k*0.9;
    p.obj.atm.material.uniforms.intensity.value = p.obj.atmBase*(1 + k*2.5);
    if (p.obj.clouds) p.obj.clouds.rotation.y += dt*0.025;
    p.obj.sphere.rotation.y += dt * p.spin;
  });

  shocks = shocks.filter(function(sh){
    sh.t += dt; var p = sh.t/sh.life;
    if (p >= 1) { scene.remove(sh.mesh); sh.mesh.geometry.dispose(); sh.mesh.material.dispose(); return false; }
    sh.mesh.scale.setScalar(sh.base*(1+p*2.8));
    sh.mesh.material.opacity = 0.8*(1-p);
    sh.mesh.lookAt(camera.position);
    return true;
  });

  bursts = bursts.filter(function(b){
    b.t += dt; var p = b.t/b.life;
    if (p >= 1) { scene.remove(b.pts); b.geo.dispose(); b.mat.dispose(); return false; }
    var arr = b.geo.attributes.position.array;
    for (var i=0;i<b.vel.length;i++){
      arr[i*3]+=b.vel[i].x*dt; arr[i*3+1]+=b.vel[i].y*dt; arr[i*3+2]+=b.vel[i].z*dt;
      b.vel[i].multiplyScalar(0.965);
    }
    b.geo.attributes.position.needsUpdate = true;
    b.mat.opacity = 1-p*p;
    return true;
  });

  userStars.forEach(function(u,i){
    var age = gt - u.born;
    var grow = Math.min(1, age*3);
    u.sp.scale.setScalar(grow*(1.9 + Math.sin(gt*3+i*1.7)*0.35));
  });
  if (constLine) constMat.opacity = 0.3 + Math.sin(gt*1.5)*0.1;

  if (showerLeft > 0) {
    showerT -= dt;
    if (showerT <= 0) { spawnShootingStar(); showerLeft--; showerT = 0.13; }
  }

  nextUfo -= dt;
  if (!ufo && nextUfo <= 0) spawnUfo();
  if (ufo) {
    var u = ufo;
    u.t += dt;
    // chasing lights, spinning hull, a pilot who looks around
    var head = Math.floor(gt*14) % u.lights.length;
    u.lights.forEach(function(m,i){
      var d = (i - head + u.lights.length) % u.lights.length;
      m.color.setHex(d === 0 ? 0xffffff : d < 3 ? 0xff3080 : 0x0a6a88);
    });
    u.spinG.rotation.y += dt*1.2;
    u.alien.rotation.y = Math.sin(u.t*0.9)*1.1;
    u.alien.position.y = 0.16 + Math.sin(u.t*3)*0.01;
    u.coreGlow.material.opacity = 0.6 + Math.sin(u.t*6)*0.25;
    if (!u.flee) {
      var s = u.t/u.dur;
      var e = s*s*(3-2*s);
      u.g.position.lerpVectors(u.from, u.to, e);
      u.g.position.y += Math.sin(u.t*2.2)*0.22;
      u.g.rotation.z = Math.sin(u.t*1.4)*0.12;
      var beamOn = s > 0.4 && s < 0.6 ? Math.sin((s-0.4)/0.2*Math.PI) : 0;
      u.beamMat.opacity = beamOn*0.32;
      u.glow.intensity = 1.2 + beamOn*2;
      if (s >= 1) { scene.remove(u.g); ufo = null; nextUfo = 9 + Math.random()*9; }
    } else {
      u.fleeT += dt;
      u.beamMat.opacity = 0;
      u.g.position.y += (3 + u.fleeT*18)*dt;
      u.g.position.x += (u.to.x > u.from.x ? 1 : -1)*(4 + u.fleeT*10)*dt;
      u.g.rotation.y += dt*18;
      u.g.scale.setScalar(Math.max(0.05, 1 - u.fleeT*0.5));
      if (u.fleeT > 1.6) { scene.remove(u.g); ufo = null; nextUfo = 10 + Math.random()*8; }
    }
  }
}

var waving = false, waveT = 0, waveRot0 = 0, waveBurst = false;
var WAVE_DUR = 2.2;
function startWave() {
  waving = true; waveT = 0; waveBurst = false;
  waveRot0 = robot.root.rotation.y;
}
function resetWave() {
  waving = false;
  robot.rightArm.rotation.set(0,0,0); robot.leftArm.rotation.z = 0;
  robot.headG.rotation.z = 0; robot.antG.rotation.z = 0;
  robot.eyes.forEach(function(e){ e.scale.y = 1; });
  robot.mouth.scale.set(1,1,1);
}
function updateWave(dt) {
  waveT += dt;
  var w = waveT;
  if (w >= WAVE_DUR) { resetWave(); robot.root.rotation.y = waveRot0; return; }
  var up = w < 0.3 ? smooth(w/0.3) : (w > WAVE_DUR-0.4 ? smooth((WAVE_DUR-w)/0.4) : 1);
  var swing = Math.sin((w-0.3)*11) * 0.38 * up;

  var face = Math.atan2(camera.position.x - robot.root.position.x, camera.position.z - robot.root.position.z);
  var d = angDiff(waveRot0, face);
  robot.root.rotation.y = waveRot0 + d*up;

  robot.rightArm.rotation.z = up*2.6 + swing;
  robot.rightArm.rotation.x = -0.2*up;
  robot.rightElbow.rotation.x = -0.18 - 0.35*up;
  robot.leftArm.rotation.z = -0.15*up;

  robot.eyes.forEach(function(e){ e.scale.y = 1 - 0.6*up; });
  robot.mouth.scale.set(1 + 0.5*up, 1 + 0.8*up, 1);
  robot.headG.rotation.z = Math.sin(w*5)*0.12*up;
  robot.antG.rotation.z = Math.sin(w*16)*0.35*up;

  if (w < 0.45) robot.root.position.y += Math.sin(w/0.45*Math.PI)*0.14;

  if (!waveBurst && w > 0.35) {
    waveBurst = true;
    var hand = new THREE.Vector3(0.62, 2.0, 0).applyEuler(robot.root.rotation).add(robot.root.position);
    spawnBurst(hand, 0x00d4ff, 18, 1.2, 0.08);
  }
}

// Small, far-away bots are hard to hit (and station beams sit in front of the
// back ones), so a click anywhere near a bot on screen counts as clicking it.
var _pv = new THREE.Vector3();
function pickMiniScreen(cx, cy) {
  var best = null, bd = IS_TOUCH ? 60 : 46;
  miniRobots.forEach(function(mr){
    var pts = [mr.m.g.position]; if (mr.focusPt) pts.push(mr.focusPt);
    pts.forEach(function(pt){
      _pv.copy(pt); _pv.y += 0.3; _pv.project(camera);
      if (_pv.z > 1) return;
      var d = Math.hypot((_pv.x+1)/2*window.innerWidth - cx, (-_pv.y+1)/2*window.innerHeight - cy);
      if (d < bd) { bd = d; best = mr; }
    });
  });
  return best;
}

renderer.domElement.addEventListener('click', function(e) {
  mouse2d.x=(e.clientX/window.innerWidth)*2-1;
  mouse2d.y=-(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse2d,camera);

  var robotHit = raycaster.intersectObjects(robotMeshes);
  if (robotHit.length && robot.state === 'idle') {
    if (!waving) startWave();
    robotSay(WAVE_LINES[Math.floor(Math.random()*WAVE_LINES.length)], 2.4);
    return;
  }

  var near = pickMiniScreen(e.clientX, e.clientY);
  if (near) { pokeMini(near); return; }

  var hits=raycaster.intersectObjects(interactiveList());
  if(hits.length){
    var u=hits[0].object.userData;
    if(u.stIdx!==undefined) navigateTo(u.stIdx);
    else if(u.mini) pokeMini(u.mini);
    else if(u.rocket) boostRocket(u.rocket);
    else if(u.ufo) scareUfo();
    else if(u.star) catchStar(u.star);
    else if(u.planetIdx!==undefined) pokePlanet(u.planetIdx);
    return;
  }
  if (camFocus) { unfocusCam(); return; }
  var fp=new THREE.Vector3();
  if(raycaster.ray.intersectPlane(floorPlane,fp) && Math.sqrt(fp.x*fp.x+fp.z*fp.z)<9.5) spawnRipple(fp);
  else plotStar(raycaster.ray.at(36, new THREE.Vector3()));
});

renderer.domElement.addEventListener('mousemove', function(e) {
  if (IS_TOUCH) return;
  mouse2d.x=(e.clientX/window.innerWidth)*2-1;
  mouse2d.y=-(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse2d,camera);
  var hits=raycaster.intersectObjects(interactiveList());
  var hu=hits.length?hits[0].object.userData:null;
  hoveredSt=(hu&&hu.stIdx!==undefined)?hu.stIdx:null;
  renderer.domElement.style.cursor=(hits.length||pickMiniScreen(e.clientX,e.clientY))?'pointer':'default';

  if(robot.state==='idle'){
    var fp2=new THREE.Vector3(); raycaster.ray.intersectPlane(floorPlane,fp2);
    if(fp2){
      var dx=fp2.x-robot.root.position.x, dz=fp2.z-robot.root.position.z;
      var diff=angDiff(robot.root.rotation.y, Math.atan2(dx,dz));
      robot.headTargetY=Math.max(-0.45,Math.min(0.45,diff));
    }
  }
});

var activeIdx=null, panelOpen=false;

  unfocusCam();

  panelEl.classList.remove('open');
  document.querySelectorAll('.nav-dot').forEach(function(d,i){d.classList.toggle('active',i===idx);});
  document.getElementById('hint').style.opacity='0';
  var st=stationObjs[idx], px=st.data.px, pz=st.data.pz;
  var len=Math.sqrt(px*px+pz*pz), nx=-px/len, nz=-pz/len;
  robotSay('NAVIGATING → ' + st.data.label + ' ...', 6);
  robot.moveTo(px+nx*1.35, pz+nz*1.35, px, pz, function(){openPanel(st.data);});
}

function openPanel(data) {
  document.getElementById('panel-eyebrow').textContent=data.eyebrow;
  document.getElementById('panel-eyebrow').style.color=data.hex;
  document.getElementById('panel-title').textContent=data.title;
  document.getElementById('panel-body').innerHTML=data.body;

  panelEl.classList.remove('open');

  activeIdx=null; panelOpen=false;
  robotSay('RETURNING TO BASE.', 1.8);
  robot.goHome(null);

document.querySelectorAll('.nav-dot').forEach(function(dot){

});

document.addEventListener('keydown', function(e) {
  if(e.key>='1'&&e.key<='5') navigateTo(parseInt(e.key)-1);
  else if(e.key==='Escape') { if(camFocus) unfocusCam(); else if(panelOpen) closePanel(); }
  else if(e.key==='ArrowRight'&&activeIdx!==null) navigateTo((activeIdx+1)%5);
  else if(e.key==='ArrowLeft'&&activeIdx!==null)  navigateTo((activeIdx+4)%5);
});

(function(){

function robotSay(text, hold) {
  say.full = text; say.n = 0; say.acc = 0; say.hold = hold || 3.2; say.active = true;
  sayTextEl.textContent = '';
  sayEl.classList.add('show');
}

function updateSpeech(dt) {
  if (say.active) {
    if (say.n < say.full.length) {
      say.acc += dt * 42;
      var k = Math.floor(say.acc);
      if (k > 0) { say.acc -= k; say.n = Math.min(say.full.length, say.n + k); sayTextEl.textContent = say.full.slice(0, say.n); }
    } else {
      say.hold -= dt;
      if (say.hold <= 0) {
        say.active = false; sayEl.classList.remove('show');
        idleWait = idleIdx === 0 ? 0.6 : 6 + Math.random() * 4;
      }
    }
  } else if (booted && !panelOpen && !camFocus && robot.state === 'idle') {
    idleWait -= dt;
    if (idleWait <= 0) { robotSay(IDLE_LINES[idleIdx % IDLE_LINES.length], 3.8); idleIdx++; }

// Keep UNIT-E's bubble fully on screen: above the head when there's room,
// otherwise beside the head; never under the panel or past the screen edges.
var _sv2 = new THREE.Vector3();
function placeRobotBubble() {
  var W = window.innerWidth, H = window.innerHeight;
  var bw = sayEl.offsetWidth, bh = sayEl.offsetHeight;
  var floorY = panelOpen ? H - panelEl.getBoundingClientRect().height - 12 : H - 12;
  _sv.copy(robot.root.position); _sv.y += 1.95; _sv.project(camera);
  var tx = (_sv.x + 1) / 2 * W, ty = (-_sv.y + 1) / 2 * H;
  var side = panelOpen || (ty - bh - 16 < 10), left = false;
  var x, y;
  if (side) {
    _sv2.copy(robot.root.position); _sv2.y += 1.3; _sv2.project(camera);
    var hx = (_sv2.x + 1) / 2 * W, hy = (-_sv2.y + 1) / 2 * H;
    if (hx + 44 + bw <= W - 10) { x = hx; }                       // fits on the right
    else if (hx - 44 - bw >= 10) { x = hx; left = true; }          // fits on the left
    else { side = false; }                                          // narrow phone: go above, clamped
    y = Math.max(bh/2 + 10, Math.min(floorY - bh/2, hy));
  }
  if (!side) {
    x = Math.max(bw/2 + 10, Math.min(W - bw/2 - 10, tx));
    y = Math.max(bh + 18, Math.min(ty, floorY));
  }
  sayEl.classList.toggle('side', side);
  sayEl.classList.toggle('left', side && left);
  sayEl.style.left = x + 'px';
  sayEl.style.top  = y + 'px';
  sayEl.style.visibility = (_sv.z > 1 || camFocus) ? 'hidden' : '';
}

// ─── Mini-robot task animations ──────────────────────────────────────────────

var _tmpV = new THREE.Vector3();

function updateFranka(mr, dt) {
  var F=mr.F, m=mr.m, T=6;
  var n=Math.floor(mr.t/T), u=(mr.t%T)/T;
  var srcI=(n%2), dstI=1-srcI;
  var src=srcI?F.yawB:F.yawA, dst=srcI?F.yawA:F.yawB;
  var K=F.keys, k=0;
  while(k<K.length-2 && u>K[k+1][0]) k++;
  var a=K[k], b=K[k+1], f=smooth((u-a[0])/(b[0]-a[0]));
  var Y=[0,src,dst];
  var yaw=Y[a[1]]+(Y[b[1]]-Y[a[1]])*f;
  var rr=a[2]+(b[2]-a[2])*f, hh=a[3]+(b[3]-a[3])*f, grip=a[4]+(b[4]-a[4])*f;

  // 2-link IK in the arm's vertical plane; wrist always points the gripper down
  F.yawG.rotation.y=yaw;
  var wy=hh+F.G-F.S, d=Math.min(Math.sqrt(rr*rr+wy*wy), F.L1+F.L2-0.001);
  var al=Math.atan2(rr,wy);
  var E=Math.acos(Math.max(-1,Math.min(1,(F.L1*F.L1+F.L2*F.L2-d*d)/(2*F.L1*F.L2))));
  var B=Math.acos(Math.max(-1,Math.min(1,(F.L1*F.L1+d*d-F.L2*F.L2)/(2*F.L1*d))));
  var p1=al-B, p2=Math.PI-E;
  F.sh.rotation.z=-p1; F.el.rotation.z=-p2; F.wr.rotation.z=-(Math.PI-p1-p2);
  var gap=0.072-0.018*grip;
  F.f1.position.x=gap/2+0.009; F.f2.position.x=-gap/2-0.009;

  if (u<0.28) F.cube.position.set(F.padPos[srcI].x,0.045,F.padPos[srcI].z);
  else if (u<0.71) { F.cube.position.set(F.bx+rr*Math.cos(yaw), hh, F.bz-rr*Math.sin(yaw)); F.cube.rotation.y=yaw; }
  else F.cube.position.set(F.padPos[dstI].x,0.045,F.padPos[dstI].z);

  if (u>=0.71 && F.lastPlaced!==n) {
    F.lastPlaced=n; F.padGlow[dstI]=1;
    F.cube.getWorldPosition(_tmpV); spawnBurst(_tmpV, 0xff8855, 14, 0.7, 0.07);
  }
  for (var i=0;i<2;i++){ F.padGlow[i]=Math.max(0,F.padGlow[i]-dt*1.2); F.pads[i].opacity=0.3+F.padGlow[i]*0.6; }

  // supervisor watches the cube and taps the tablet
  var la=Math.atan2(F.cube.position.x, F.cube.position.z);
  m.headG.rotation.y=damp(m.headG.rotation.y, Math.max(-0.9,Math.min(0.9,la)), 4, dt);
  m.headG.rotation.x=0.18;
  m.armRG.rotation.x=-0.7+Math.sin(mr.t*7)*0.08;
  mr.scr.opacity=0.7+Math.sin(mr.t*3)*0.15;
}

function updateYolo(mr, dt) {
  var m=mr.m;
  var hy=Math.sin(mr.t*0.75)*0.8;
  m.headG.rotation.y=hy; m.headG.rotation.x=0.12;
  mr.beamMat.opacity=0.07+Math.abs(Math.sin(mr.t*5))*0.04;
  mr.dets.forEach(function(d){
    if (Math.abs(hy-d.ang)<0.1) { if (d.v<0.15) d.pop=1; d.v=1; }
    else d.v=Math.max(0,d.v-dt*0.3);
    d.pop=Math.max(0,d.pop-dt*3);
    d.box.scale.setScalar(1+d.pop*0.35);
    var vis=Math.min(1,d.v*1.4);
    d.box.material.opacity=vis*(d.pop>0 ? (Math.sin(mr.t*40)>0?1:0.3) : 0.9);
    d.label.material.opacity=vis;
    d.obj.rotation.y+=dt*0.3;
  });
}

function updateSam(mr, dt) {
  var m=mr.m;
  var sz=0.35+((mr.t*0.3)%1)*0.65;
  mr.scanLine.position.z=sz; mr.curtain.position.z=sz;
  mr.slMat.opacity=0.6+Math.abs(Math.sin(mr.t*3))*0.35;
  mr.curtainMat.opacity=0.06+Math.abs(Math.sin(mr.t*3))*0.06;
  var focus=0, best=99;
  mr.segs.forEach(function(s,k){
    var lt=((mr.t-k*1.4)%7+7)%7;
    var pp = lt<0.25 ? lt/0.25 : 1;
    var po = lt<0.5 ? 1 : Math.max(0,1-(lt-0.5)/0.4);
    s.pr.scale.setScalar(0.22*pp); s.pr.material.opacity=po;
    var a = lt<0.3?0 : lt<0.8?(lt-0.3)/0.5 : lt<5.8?1 : lt<6.5?1-(lt-5.8)/0.7 : 0;
    var sa=smooth(a);
    s.ov.material.opacity=0.55*sa;
    s.fl.material.opacity=0.28*sa;
    s.rg.material.opacity=0.9*sa;
    s.rg.scale.setScalar(0.5+0.5*sa);
    if (lt<best) { best=lt; focus=s.ang; }
  });
  m.headG.rotation.y=damp(m.headG.rotation.y, focus, 3, dt);
  m.headG.rotation.x=0.2;
}

function rlPolicy(i,j) {
  if (j===3) return 0;
  if (i===3) return 2;
  if (i===0) return 2;
  if (j===0) return 0;
  if (i===1&&j===2) return 2;
  if (i===2&&j===1) return 0;
  return 2;
}
var RL_DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function updateRL(mr, dt) {
  var R=mr.R, m=mr.m;
  R.hopT=Math.min(1,R.hopT+dt/0.24);
  var hp=smooth(R.hopT);
  var ax=R.tx(R.fi)+(R.tx(R.i)-R.tx(R.fi))*hp, az=R.tz(R.fj)+(R.tz(R.j)-R.tz(R.fj))*hp;
  R.agent.position.set(ax, 0.065+Math.sin(hp*Math.PI)*0.08, az);

  if (R.hopT>=1 && !R.landed) {
    R.landed=true; R.steps++;
    R.glow[R.i][R.j]=1;
    var key=R.i+','+R.j, rew=null;
    if (R.lava[key]) {
      rew=-1; R.minusT=0; R.minus.position.set(ax,0.22,az);
      R.agent.getWorldPosition(_tmpV); spawnBurst(_tmpV,0xff4422,16,0.8,0.07);
    } else if (R.i===3&&R.j===3) {
      rew=Math.max(0.2, 1-R.steps*0.04); R.plusT=0; R.plus.position.set(ax,0.24,az);
      R.agent.getWorldPosition(_tmpV); spawnBurst(_tmpV,0xffdd33,20,0.9,0.08);
    } else if (R.steps>=18) rew=-0.5;
    if (rew!==null) {
      R.done=true; R.timer=0.9;
      R.rewards.push(rew); if (R.rewards.length>16) R.rewards.shift();
      drawRLChart(R);
    }
  }

  R.timer-=dt;
  if (R.timer<=0) {
    if (R.done) {
      R.done=false; R.ep++; R.steps=0;
      if (R.ep>=24) { R.ep=0; R.rewards=[]; }
      R.fi=R.i=0; R.fj=R.j=0; R.hopT=1; R.landed=true;
      drawRLChart(R);
      R.timer=0.45;
    } else {
      var eps=Math.max(0.05, 0.8*Math.pow(0.82,R.ep));
      var act = Math.random()<eps ? Math.floor(Math.random()*4) : rlPolicy(R.i,R.j);
      R.fi=R.i; R.fj=R.j;
      R.i=Math.max(0,Math.min(3,R.i+RL_DIRS[act][0]));
      R.j=Math.max(0,Math.min(3,R.j+RL_DIRS[act][1]));
      R.hopT=0; R.landed=false; R.timer=0.3;
    }
  }

  for (var i=0;i<4;i++) for (var j=0;j<4;j++){
    R.glow[i][j]=Math.max(0,R.glow[i][j]-dt*0.9);
    R.tiles[i][j].mat.emissiveIntensity=R.tiles[i][j].base+R.glow[i][j]*0.9;
  }
  R.plusT=Math.min(1,R.plusT+dt/1.1);  R.plus.material.opacity=1-R.plusT;  R.plus.position.y+=dt*0.12;
  R.minusT=Math.min(1,R.minusT+dt/1.1); R.minus.material.opacity=1-R.minusT; R.minus.position.y+=dt*0.12;
  R.flag.rotation.y=Math.sin(mr.t*4)*0.4;
  R.agentGlow.material.opacity=0.7+Math.sin(mr.t*8)*0.2;

  var la=Math.atan2(ax,az);
  m.headG.rotation.y=damp(m.headG.rotation.y, la, 5, dt);
  m.headG.rotation.x=0.22;
}

// ─── Main loop ────────────────────────────────────────────────────────────────

var clock=new THREE.Clock(), gt=0;

function animate() {
  requestAnimationFrame(animate);
  var dt=Math.min(clock.getDelta(),0.05);
  gt+=dt;

  robot.update(dt);

  if (waving) updateWave(dt);

  stationObjs.forEach(function(st,si) {
    var ex=st.extras, t=gt, seed=ex.seed;
    var isHov=(si===hoveredSt)||(si===labelHover), isAct=(si===activeIdx), hot=isHov||isAct;

    ex.fGroup.position.y=0.2+Math.sin(t*1.4+seed)*0.055;
    var tScale=hot?1.12:1;
    ex.fGroup.scale.x+=(tScale-ex.fGroup.scale.x)*0.1;
    ex.fGroup.scale.y+=(tScale-ex.fGroup.scale.y)*0.1;
    ex.fGroup.scale.z+=(tScale-ex.fGroup.scale.z)*0.1;

    ex.ptLight.intensity=(hot?3.0:1.4)+Math.sin(t*2.2+seed)*0.25;

    var bT = isAct?0.7 : isHov?0.55 : 0.24+Math.sin(t*1.6+seed)*0.06;
    ex.beam.material.opacity += (bT-ex.beam.material.opacity)*0.12;
    ex.pulses.forEach(function(pr){
      var q=((t*0.45)+pr.userData.phase)%1;
      pr.scale.setScalar(1+q*1.5);
      pr.material.opacity=(1-q)*(hot?0.8:0.45);
    });
    stationRims[si].emissiveIntensity = hot ? 2.0 : 0.8+Math.sin(t*2+seed)*0.25;
    stationGlows[si].opacity = hot ? 0.2 : 0.1;
    st.labelEl.classList.toggle('hot', hot);

    if(ex.screen) ex.screen.material.emissiveIntensity=0.6+Math.sin(t*0.9+seed)*0.18;

    if(ex.nnNodes.length){
      ex.nnNodes.forEach(function(n,ni){
        n.material.emissiveIntensity=0.25+Math.abs(Math.sin(t*2+ni*0.6))*0.9;
        n.material.opacity=0.6+Math.abs(Math.sin(t*1.5+ni*0.4))*0.4;
      });
      ex.nnLines.forEach(function(l,li){
        l.mat.opacity=0.06+Math.abs(Math.sin(t*1.8+li*0.3))*0.3;
      });
    }

    if(ex.armSeg1){
      ex.armSeg1.rotation.z=Math.sin(t*0.7+seed)*0.5;
      ex.armSeg2.rotation.z=Math.sin(t*0.9+seed+1)*0.4;
      if(ex.claw){ ex.claw.rotation.y=t*1.2; ex.claw.children[0].position.x=0.055+Math.sin(t*1.5)*0.02; ex.claw.children[1].position.x=-0.055-Math.sin(t*1.5)*0.02; }
    }

    if(ex.screens){
      ex.screens.forEach(function(s){
        var ang=s.userData.baseAngle+t*0.5;
        var r=s.userData.orbitR;
        s.position.set(Math.sin(ang)*r, s.userData.height, Math.cos(ang)*r);
        s.rotation.y=-ang;
      });
    }

    if(ex.rings.length){
      ex.rings.forEach(function(r){
        var rp=((t*0.55)+r.userData.phase)%1;
        var sc=1+rp*10; r.scale.set(sc,1,sc); r.material.opacity=(1-rp)*0.65;
      });
    }
  });

  scene.traverse(function(o){ if(o.userData.isSky) o.rotation.y=gt*0.0012; });
  if(starLayers.length){
    starLayers[0].opacity = 0.78 + Math.sin(gt*0.28)*0.06;
    starLayers[1].opacity = 0.84 + Math.sin(gt*0.41+1.2)*0.08;
    starLayers[2].opacity = 0.74 + Math.sin(gt*0.37+2.5)*0.07;
    starLayers[3].opacity = 0.68 + Math.sin(gt*0.33+0.8)*0.08;
    starLayers[4].opacity = 0.64 + Math.sin(gt*0.45+3.1)*0.07;
  }
  nebulaCloud.forEach(function(nc){
    nc.pts.rotation.y += nc.spd * dt;
    nc.mat.opacity = 0.055 + Math.abs(Math.sin(gt*0.22+nc.seed))*0.055;
  });

  planets.forEach(function(p){
    p.ang += p.spd * dt;
    p.obj.g.position.set(Math.cos(p.ang)*p.rx, p.Y + Math.sin(p.ang*2)*0.3, p.cz + Math.sin(p.ang)*p.rz);
    p.obj.sphere.rotation.y += dt * 0.06;
  });
  moons.forEach(function(m){ m.pivot.rotation.y += m.spd * dt; });

  updateDock(dt);
  edgeRing.material.opacity=0.55+Math.sin(gt*0.8)*0.12;

  for(var pi=0;pi<PC;pi++){
    pPos[pi*3]+=pVel[pi][0]; pPos[pi*3+1]+=pVel[pi][1]; pPos[pi*3+2]+=pVel[pi][2];
    if(pPos[pi*3+1]>7){pPos[pi*3+1]=0;pPos[pi*3]=(Math.random()-0.5)*17;pPos[pi*3+2]=(Math.random()-0.5)*17;}
  }
  pGeo.attributes.position.needsUpdate=true;

  ripples=ripples.filter(function(r){
    r.t+=dt; var p=r.t/r.life;
    if(p>=1){scene.remove(r.mesh); r.mesh.geometry.dispose(); r.mesh.material.dispose(); return false;}
    var sc=1+p*r.max; r.mesh.scale.set(sc,1,sc); r.mesh.material.opacity=r.op*(1-p);
    return true;
  });

  // Camera follow + parallax
  var cb = camBase();
  // Focused on a bot: fly in close and look at it from in front of its workstation
  var zoomTarget = camFocus ? ((window.innerWidth/window.innerHeight) < 0.75 ? 0.16 : 0.14) : (panelOpen ? 0.62 : 1);
  camZoom += (zoomTarget - camZoom) * 0.05;
  var focusPos = camFocus ? (camFocus.focusPt || camFocus.m.g.position) : robot.root.position;
  var yawTarget = camFocus ? (camFocus.type === 'patrol' ? camFocus.yaw : camFocus.baseRot) : 0;
  camYaw += angDiff(camYaw, yawTarget) * 0.04;
  camT.lerp(focusPos, 0.06);
  var par = 0.5 * camZoom, hd = cb.z * camZoom;
  var tx=camT.x + Math.sin(camYaw)*hd + mouseParallax.x*par;
  var ty=camT.y + cb.y*camZoom;
  var tz=camT.z + Math.cos(camYaw)*hd - mouseParallax.y*par;
  camera.position.x+=(tx-camera.position.x)*0.055;
  camera.position.y+=(ty-camera.position.y)*0.055;
  camera.position.z+=(tz-camera.position.z)*0.055;
  camera.lookAt(camT.x, camT.y + (camFocus ? 0.25 : 0.5), camT.z);

  var vsTarget = panelOpen ? window.innerHeight*0.3 : 0;
  viewShift += (vsTarget - viewShift) * 0.08;
  if (Math.abs(viewShift) > 0.5) {
    camera.setViewOffset(window.innerWidth, window.innerHeight, 0, viewShift, window.innerWidth, window.innerHeight);
  } else if (camera.view && camera.view.enabled) {
    camera.clearViewOffset();
  }

  // ── Mini robots ──────────────────────────────────────────────────────────
  updateMeetings(dt);
  miniRobots.forEach(function(mr) {
    mr.t += dt;
    var m = mr.m;
    if (mr.type !== 'patrol') { m.g.position.y = mr.baseY; m.g.rotation.y = mr.baseRot; }

    if (mr.type === 'patrol') {
      updatePatrol(mr, dt);
    } else if (mr.type === 'franka') updateFranka(mr, dt);
    else if (mr.type === 'yolo') updateYolo(mr, dt);
    else if (mr.type === 'sam') updateSam(mr, dt);
    else if (mr.type === 'rl') updateRL(mr, dt);
    if (mr.type !== 'patrol') updateTaskGreet(mr, dt);

    // idle life: blink, antenna pulse, halo breathing
    mr.nextBlink -= dt;
    if (mr.nextBlink <= 0) { mr.blinkT = 0.12; mr.nextBlink = 2 + Math.random()*4; }
    var bl = 1; if (mr.blinkT > 0) { mr.blinkT -= dt; bl = 0.15; }
    m.eyes[0].scale.y = m.eyes[1].scale.y = bl;
    m.antBall.scale.setScalar(1 + Math.sin(mr.t*3.5)*0.2);
    m.halo.intensity = 1.5 + Math.sin(mr.t*2)*0.3;

    if (mr.hop > 0) {
      mr.hop = Math.max(0, mr.hop - dt/0.75);
      var hk = 1 - mr.hop;
      m.g.position.y += Math.sin(hk*Math.PI)*0.5;
      m.g.rotation.y += hk*Math.PI*2;
      m.halo.intensity += Math.sin(hk*Math.PI)*3;
    }
  });

  // ── Shooting stars ────────────────────────────────────────────────────────
  nextShoot -= dt;
  if(nextShoot <= 0) { spawnShootingStar(); nextShoot = 1.5+Math.random()*3.5; }
  shootingStars = shootingStars.filter(function(ss) {
    ss.t += dt;
    var p = ss.t/ss.life;
    if(p >= 1 || ss.caught) { scene.remove(ss.line); scene.remove(ss.hMesh); scene.remove(ss.hit); return false; }
    ss.line.position.addScaledVector(ss.dir, ss.speed*dt);
    ss.hMesh.position.copy(ss.line.position);
    ss.hit.position.copy(ss.line.position).addScaledVector(ss.dir, ss.len*0.3);
    var op = 1.0*(1-p*p);
    ss.mat.opacity = op; ss.hMat.opacity = op;
    return true;
  });

  // ── Rockets ──
  updateRockets(dt);

  updateSpace(dt);

  renderer.render(scene,camera);
  updateLabels();
  updateSpeech(dt);
}

// ─── Boot ─────────────────────────────────────────────────────────────────────

animate();
setTimeout(function(){
  var el=document.getElementById('loading');
  el.classList.add('fade');
  setTimeout(function(){el.style.display='none';},1000);
  document.getElementById('header').classList.add('show');
  document.getElementById('nav').classList.add('show');
  document.getElementById('hint').classList.add('show');
  setTimeout(function(){ booted = true; if(!say.active && !panelOpen) robotSay('BEEP BOOP. HELLO, HUMAN.', 1.8); }, 900);
},1400);
</script>
